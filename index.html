function lionDraw(x,y){x=Math.round(x);y=Math.round(y);circle(x+12,y+11,13,'#92603d');rect(x+3,y+17,19,10,'#c89158');circle(x+12,y+11,9,'#f4c28d');circle(x+4,y+3,5,'#92603d');circle(x+21,y+3,5,'#92603d');rect(x+7,y+10,3,3,'#493b50');rect(x+16,y+10,3,3,'#493b50');rect(x+11,y+16,4,3,'#7b4d53');rect(x+7,y+21,11,4,'#e7839b');rect(x+3,y+25,7,4,'#f4c28d');rect(x+17,y+25,7,4,'#f4c28d')}
function heart(x,y){circle(x-5,y-2,6,'#f26d9e');circle(x+5,y-2,6,'#f26d9e');ctx.fillStyle='#f26d9e';ctx.beginPath();ctx.moveTo(x-11,y);ctx.lineTo(x,y+12);ctx.lineTo(x+11,y);ctx.fill()}
function cloud(c){let x=c.x-cam,y=c.y;circle(x+9,y+4,12,'#eaf8ff');circle(x+22,y-3,15,'#fff');circle(x+39,y+4,13,'#eaf8ff');rect(x+5,y+3,c.w-9,9,'#eaf8ff');rect(x+10,y+11,c.w-18,3,'#a6d4eb')}
function draw(){bg();if(level===0)[105,390,730,1100,1450,1750,2040].forEach(tree);if(level===2)[140,400,800,1200,1650,2080].forEach(tree);map.forEach(terrain);clouds.forEach(cloud);if(level===1)for(let i=0;i<3;i++)if(data.stars.includes(i))terrain(plat(1410+i*49,50,263));if(level===2&&data.story.bridge)terrain(plat(1500,52,266));for(let i=1;i<checkpoints.length;i++){let x=checkpoints[i]-cam;rect(x,G-45,4,45,'#8b6a85');rect(x+4,G-45,18,12,data.cp>=i?'#f28eaf':'#ffe5a1')}
for(let o of objects){let x=o.x-cam;if(x<-40||x>W+40)continue;if(o.type==='heart'&&!data.hearts[level])heart(x,o.y);if(o.type==='star'&&!data.stars.includes(o.id)){circle(x,o.y,9,'#ffe3a2');rect(x-2,o.y-13,4,26,'#fff6c4');rect(x-13,o.y-2,26,4,'#fff6c4')}if(o.type==='shell'&&!data.shells.includes(o.id)){circle(x,o.y,6,'#ffd7a4');rect(x-5,o.y+2,10,3,'#e9a88f')}if(o.type==='pipe'){rect(x,G-39,42,39,'#4bba83');rect(x-5,G-44,52,10,'#7cdda0');circle(x+20,G-58,7,'#fff1a8')}if(o.type==='switch'){rect(x,G-20,28,20,'#a1a2d5');circle(x+14,G-24,8,'#ffcf6e')}}
for(let e of enemies){let x=e.x-cam;circle(x,G-13,12,'#b978b0');circle(x-5,G-15,2,'#fff');circle(x+5,G-15,2,'#fff')}
if(level===0&&!data.met){lionDraw(350-cam,G-28);circle(363-cam,G-56,10,'#fff6e8');ctx.fillStyle='#9d6492';ctx.font='bold 14px sans-serif';ctx.fillText('!',359-cam,G-51)}else lionDraw(lion.x-cam,lion.y);bunny(p.x-cam,p.y);
if(level===0||level===2){rect(levelEnd-70-cam,G-90,5,90,'#fff4e4');rect(levelEnd-65-cam,G-90,48,24,'#f18eb2');ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText('终点',levelEnd-59-cam,G-73)}
if(level===1&&data.story.fireworks){for(let i=0;i<8;i++){let x=(i*83+timer*.02)%W,y=60+(i*47)%105;for(let j=0;j<12;j++){let a=j*Math.PI/6;circle(x+Math.cos(a)*18,y+Math.sin(a)*18,2,i%2?'#ffcb8e':'#ff91c1')}}}
$('#hud').textContent='❤️ '+data.hearts.filter(Boolean).length+'/3　🌱 '+(data.seed?1:0)+'/1　'+LEVELS[level]+(level===1?'　🐚 '+data.shells.length+'/5　⭐ '+data.stars.length+'/3':'')}
function loop(t){try{let dt=Math.min(40,t-last||16);last=t;if(mode==='play')update(dt);draw()}catch(e){$('#error').style.display='block';$('#error').textContent='游戏运行异常：'+e.message;return}requestAnimationFrame(loop)}
$('#interact').addEventListener('click',()=>{if(mode!=='play')return;if(level===1&&!data.story.sunset){data.story.sunset=true;save();cut('🌅 大阪海边的夕阳','小兔子和小狮子坐在沙滩上，静静看着太阳落入海面。<br><br>那天，我们一起等太阳落下，也一起等烟花升起。',()=>{respawnAt(610);play()})}else if(level===2&&!data.seed){data.seed=true;save();cut('🌱 找到未来的种子','小兔子钻进发光管道，找到一颗小小的种子。<br>「这是未来的种子，我们一起把它种下吧。」',()=>{checkpoint(1);respawnAt(1010);play()})}});
['left','right','jump'].forEach(key=>{let el=$('#'+key);function down(e){e.preventDefault();if(mode!=='play')return;try{el.setPointerCapture(e.pointerId)}catch(_){}held[key]=true;el.classList.add('pressed');if(key==='jump')jumpQueue=true}function up(e){e.preventDefault();held[key]=false;el.classList.remove('pressed')}el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','ArrowUp','Escape'].includes(e.code))e.preventDefault();if(e.code==='Escape'){if(mode==='play')pause();return}if(mode!=='play')return;if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if((e.code==='Space'||e.code==='ArrowUp')&&!held.jump){held.jump=true;jumpQueue=true}});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false;if(e.code==='Space'||e.code==='ArrowUp')held.jump=false});$('#pause').addEventListener('click',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});window.addEventListener('blur',()=>{if(mode==='play')pause()});document.addEventListener('contextmenu',e=>e.preventDefault());['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});let lastTouch=0;document.addEventListener('touchend',e=>{let now=Date.now();if(now-lastTouch<320&&e.cancelable)e.preventDefault();lastTouch=now},{passive:false});
function size(){let vh=window.visualViewport?window.visualViewport.height:window.innerHeight,vw=window.visualViewport?window.visualViewport.width:window.innerWidth;vh=Math.max(200,vh);vw=Math.max(300,vw);document.documentElement.style.setProperty('--available-height',vh+'px');W=Math.max(640,Math.round(360*vw/vh));canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false;cam=Math.max(0,Math.min(levelEnd-W,cam))}window.addEventListener('resize',size);window.addEventListener('orientationchange',()=>setTimeout(size,250));if(window.visualViewport)window.visualViewport.addEventListener('resize',size);
load();layout(Math.min(2,data.level));respawnAt(checkpoints[Math.min(2,data.cp)]);size();home();requestAnimationFrame(loop);
})();
</script></body></html>
