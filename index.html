(function(){'use strict';

let data=freshData();
let p={x:45,y:G-27,w:22,h:27,vx:0,vy:0,on:false,ride:null,coyote:0,buffer:0,jumpMs:0,face:1,sit:false,hidden:false}, lion={x:30,y:G-27,sit:false,face:1};
let L=null;

// ================= Level data =================
const gr=(x,w)=>({x,y:G,w,kind:'ground'}), bl=(x,w,y)=>({x,y,w,kind:'block'});
const qb=(id,x,y)=>({kind:'q',id,x,y,w:22,h:22});
const mover=(x0,y0,w,ax,ay,period)=>({kind:'mover',x0,y0,w,ax,ay,period,x:x0,y:y0,dx:0,dy:0});

const spring=(x)=>({kind:'spring',x,y:G-14,w:26,anim:0});
const coins=(start,list)=>list.map((c,i)=>({type:'coin',id:start+i,x:c[0],y:c[1]}));
const row=(x,y,n,dx=18)=>Array.from({length:n},(_,i)=>[x+i*dx,y]);
const arc=(x,y,n,dx=18,h=18)=>Array.from({length:n},(_,i)=>[x+i*dx,y-Math.round(Math.sin(i/(n-1)*Math.PI)*h)]);
function buildLevel(n){
 if(n===0) return {end:2140,
  map:[gr(0,405),gr(451,490),gr(989,460),gr(1497,670),bl(235,92,244),bl(595,98,241),bl(1110,105,238),bl(1690,100,235)],
  boxes:[qb(0,150,190),qb(1,520,190),qb(2,770,190),qb(3,792,190),qb(4,1320,190)],
  plats:[spring(1860)],
  cps:[45,360,1000,1515], trees:[105,390,730,1040,1450,1610,2040],
  enemies:[{type:'walker',x:1620,start:1580,end:1670,v:.35}],
  objects:[{type:'heart',x:1995,y:242},{type:'sign',x:118,text:'从下面顶一下 ？ 砖块'},{type:'sign',x:1420,text:'跳到小怪头上能踩扁它'},{type:'sign',x:1810,text:'踩蘑菇弹簧跳得更高'},
   ...coins(0,[...arc(410,250,3,18,12),...row(612,214,4,20),...arc(944,245,3,20,14),...row(1130,212,3,24),...row(1855,120,3,22),...row(1925,150,2,22)])]};
 if(n===1) return {end:2250,
  map:[gr(0,480),gr(520,500),gr(1060,350),gr(1560,330),gr(2010,270),bl(250,95,247),bl(710,115,244),bl(1190,105,242),bl(1660,105,247)],
  boxes:[qb(0,380,190),qb(1,640,190),qb(2,1110,186),qb(3,1700,170)],
  plats:[mover(1922,G-2,58,40,0,3400),spring(1600)],
  cps:[45,650,1070,1580], trees:[],
  enemies:[{type:'walker',x:180,start:140,end:232,v:.35},{type:'walker',x:880,start:835,end:955,v:.45}],
  objects:[{type:'star',id:0,x:820,y:214},{type:'star',id:1,x:1150,y:228},{type:'star',id:2,x:1365,y:219},
   {type:'shell',id:0,x:185,y:G-8},{type:'shell',id:1,x:445,y:G-8},{type:'shell',id:2,x:930,y:G-8},{type:'shell',id:3,x:1242,y:242-8},{type:'shell',id:4,x:1615,y:96},
   ...coins(0,[...arc(484,260,3,16,12),...row(735,218,4,22),...arc(1024,262,3,14,10),...row(1580,130,2,26),...row(1906,236,5,20),...row(2040,250,3,22)])]};
 return {end:2350,
  map:[gr(0,490),gr(535,475),gr(1050,455),gr(1550,450),gr(2110,290),bl(240,110,240),bl(700,110,241),bl(1220,115,229),bl(1750,110,241)],
  boxes:[qb(0,600,190),qb(1,1080,190),qb(2,1660,190),qb(3,1682,190)],
  plats:[spring(430),mover(1342,236,48,0,48,2800),plank(2004,50),plank(2056,52)],
  cps:[45,600,950,1580,1890,2130], trees:[140,620,1150,1650,2230],
  enemies:[{type:'walker',x:120,start:95,end:195,v:.4},{type:'fly',x:600,start:560,end:680,v:.5,base:222,amp:18},
   {type:'walker',x:1120,start:1070,end:1195,v:.45},{type:'frog',x:1650,start:1600,end:1730,v:.35},{type:'fly',x:1930,start:1900,end:1990,v:.45,base:226,amp:16}],
  objects:[{type:'pipe',x:860,w:42,top:G-44},{type:'exitpipe',x:925,w:34,top:G-30},{type:'switch',x:1420},{type:'heart',x:2160,y:236},
   ...coins(0,[...row(420,110,3,20),...arc(495,258,3,18,10),...row(1346,100,3,20),...row(1236,150,5,20),...row(1012,250,2,22),...row(2015,246,5,20)])]};
}
// Underground bonus room behind the glowing pipe (level 3)
function buildUnder(){return {key:'2u',under:true,end:900,
 map:[gr(0,900),bl(300,60,250),bl(520,60,230)],
 boxes:[qb(0,160,190),qb(1,182,190),qb(2,204,190)],
 plats:[],cps:[70],trees:[],enemies:[],
 objects:[{type:'seed',x:700,y:G-22},{type:'pipe',x:820,w:42,top:G-44,exit:true},{type:'sign',x:640,text:'拿到种子，再从绿色管道出去'},
  ...coins(0,[...arc(226,246,4,18,24),...row(310,215,3,20),...arc(440,240,4,18,30),...row(530,195,3,20),...row(620,250,3,18)])]}}
const PIPE=()=>L.objects.find(o=>o.type==='pipe');
const LK=()=>L&&L.key||String(level);
const qKey=b=>LK()+'-q'+b.id, cKey=o=>LK()+'-c'+o.id;
function totalCoins(){let t=0;for(const l of [buildLevel(0),buildLevel(1),buildLevel(2),buildUnder()])t+=l.objects.filter(o=>o.type==='coin').length+l.boxes.length;return t}
const TOTAL_COINS=totalCoins();

function surfaces(){
 const arr=[];
 for(const a of L.map)arr.push(a.kind==='block'?{x:a.x,y:a.y,w:a.w,h:H+200,kind:'block',box:true}:a);
 for(const b of L.boxes)arr.push({x:b.x,y:b.y,w:b.w,h:b.h,kind:'q',box:true,ref:b});
 clouds.forEach(c=>arr.push({x:c.x,y:G,w:c.w,kind:'cloud'}));
 if(level===1&&!L.under)for(let i=0;i<3;i++)if(data.stars.includes(i))arr.push({x:1410+i*49,y:G,w:51,kind:'star'});
 for(const o of L.objects)if(o.type==='pipe')arr.push({x:o.x-5,y:o.top,w:o.w+10,h:G-o.top,kind:'pipe',box:true,ref:o});
 if(level===2&&!L.under&&data.story.bridge)arr.push({x:1500,y:G,w:55,kind:'bridge'});
 for(const pl of L.plats){if(pl.kind==='fall'&&pl.y>H+40)continue;arr.push({x:pl.x,y:pl.y,w:pl.w,kind:pl.kind,ref:pl})}
 return arr}
function onFloor(x){return L.map.some(a=>a.kind==='ground'&&x+p.w>a.x+4&&x<a.x+a.w-4)}
function insideBox(x){return surfaces().some(a=>a.box&&a.y<G-8&&a.y+a.h>G-p.h&&x+p.w>a.x&&x<a.x+a.w)}
function safeX(x){for(let d=0;d<400;d+=4){for(const c of [x-d,x+d]){if(c>5&&c<L.end-40&&onFloor(c)&&!insideBox(c))return c}}return 45}

// ================= Save =================
function save(){try{localStorage.setItem(SAVE,JSON.stringify(data))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem(SAVE)||'null');if(d&&d.version===1){data=Object.assign(freshData(),d);data.hearts=(data.hearts||[]).slice(0,3);while(data.hearts.length<3)data.hearts.push(false);data.story=data.story||{};data.coins=data.coins||[];data.qb=data.qb||[];assist=data.assist!==false}}catch(e){}}
function gateOk(){try{return localStorage.getItem(GATE)==='1'}catch(e){return false}}

// ================= Flow =================
function clearInput(){Object.keys(held).forEach(k=>{held[k]=false;$('#'+k).classList.remove('pressed')});jumpQueue=false}
function layout(n){level=n;L=buildLevel(n);mainL=null;L.pops=[];clouds=[];sleeping=false;failCount=0;failCp=-1;scene=null;dying=null;L.enemies.forEach(e=>{e.v=Math.abs(e.v);e.dead=0;e.vy=0;e.hop=0;e.jt=Math.random()*900})}
function resetPlanks(){for(const pl of L.plats)if(pl.kind==='fall'){pl.y=pl.y0;pl.t=0;pl.vy=0}}
function respawnAt(x){x=safeX(x);p.x=x;p.y=G-p.h;p.vx=p.vy=0;p.on=true;p.ride=null;p.sit=false;p.hidden=false;p.coyote=p.buffer=p.jumpMs=0;lion.x=x-34*p.face;lion.y=p.y;lion.sit=false;trail=[];resetPlanks();cam=Math.max(0,Math.min(L.end-W,x-W*.35));respawnGuard=900;clearInput()}
function startLevel(n,fromSave){layout(n);let cp=(fromSave&&data.cpLevel===n)?Math.max(0,Math.min(L.cps.length-1,data.cp)):0;data.level=Math.max(data.level,n);data.cp=cp;data.cpLevel=n;save();p.face=1;respawnAt(L.cps[cp]);play()}
function showUI(on){$('#controls').classList.toggle('hide',!on);$('#pause').classList.toggle('hide',!on);$('#hud').classList.toggle('hide',mode==='gate')}
function menu(title,body,buttons){mode='menu';clearInput();showUI(false);$('#interact').classList.add('hide');$('#shade').classList.remove('hide');$('#heading').textContent=title;$('#message').innerHTML=body;const el=$('#actions');el.textContent='';buttons.forEach((b,i)=>{let btn=document.createElement('button');btn.type='button';btn.textContent=b[0];if(i)btn.className='alt';btn.addEventListener('click',b[1]);el.appendChild(btn)});$('#card').scrollTop=0}
function play(){mode='play';$('#shade').classList.add('hide');showUI(true);last=performance.now()}
function home(){
 const started=data.met||data.level>0||data.cp>0;
 menu('🐰 我们的奇妙冒险 🦁','恋爱一周年特别篇 · 11月13日<br>春日相遇 → 海边夕阳与花火 → 秘密花园<br>左右移动，轻点 ✦ 小跳，长按 ✦ 大跳。',
 [[data.done?'回忆我们的冒险 ♡':(started?'继续我们的冒险 ♡':'开始我们的冒险 ♡'),()=>data.done?ending():startLevel(data.level,true)],
  ...(started?[['从第一关重新开始',()=>{data=freshData();assist=true;save();startLevel(0,false)}]]:[]),
  ...(data.level>0||data.done?[['选关',chooseLevel]]:[])])}
function chooseLevel(){let b=[];for(let i=0;i<=Math.min(2,data.done?2:data.level);i++)b.push([LEVELS[i],()=>startLevel(i,false)]);b.push(['返回',home]);menu('选择旅程','已解锁的关卡可以重新游玩，收集过的东西不会丢。',b)}
function pause(){if(mode!=='play')return;menu('暂停一下 ♡','小狮子会在这里等你。',[['继续冒险',play],['重新开始本关',()=>startLevel(level,false)],['辅助模式：'+(assist?'开':'关'),()=>{assist=!assist;data.assist=assist;save();mode='play';pause()}],['返回首页',home]])}
function cut(title,body,done,label){menu(title,body,[[label||'继续 ♡',done]])}
function checkpoint(i){if(data.cp<i){data.cp=i;data.cpLevel=level;save()}}
function collectHeart(i){if(!data.hearts[i]){data.hearts[i]=true;save()}}
function nextLevel(n){data.level=Math.max(data.level,n);data.cp=0;data.cpLevel=n;save();startLevel(n,false)}
function finishLevel(){
 if(level===0){collectHeart(0);cut('🌸 第一颗爱心','春日的风里，我们遇见了彼此。<br>❤️ 1 / 3　🪙 '+data.coins.length,()=>nextLevel(1))}
 else if(level===1){collectHeart(1);cut('💖 第二颗爱心','那天，我们一起看了夕阳，也一起等到了烟花。<br>❤️ 2 / 3　🪙 '+data.coins.length,()=>nextLevel(2))}
 else{if(!data.seed){cut('🌱 还缺少种子','小狮子提醒你：回去找找那根发光的绿色管道吧，跳到管道上面就能钻进去。',()=>{respawnAt(L.cps[1]);play()});return}collectHeart(2);ending()}}
function cardC(){return data.coins.length>=Math.ceil(TOTAL_COINS*.7)}
function ending(){data.done=true;save();
 menu('🌸 我们的第一个365天',ANNIV.label+'<br>🐰 ❤️ 🦁<br>我们一起种下未来的种子，<br>等它长成樱花树。<br><strong>一周年快乐 ♡</strong>',[['下一页 ♡',ending2]])}
function ending2(){const n=data.shells.length;
 const lines=[];if(n>=5)lines.push('🐚 还记得海边的贝壳吗？我们把那一天收藏起来。');else if(n>=3)lines.push('🐚 海边的夕阳，是我们珍贵的回忆。');
 if(cardC())lines.push('🪙 爱心币收集达人！隐藏回忆卡 C 已解锁');

 else{for(let i=0;i<16;i++){let x=i*220-cam*.4;rect(x,238,48,46,'#f5c9c8');rect(x-5,232,58,8,'#a783a4')}}}

function terrain(a){let x=a.x-cam;if(x>W||x+a.w<0)return;const u=L.under;rect(x,a.y,a.w,H-a.y,u?'#6b5a7e':level===1?'#c7a38f':level===2?'#a98276':'#b8867c');rect(x,a.y,a.w,9,u?'#a891c4':level===1?'#f1c59c':level===2?'#85c79b':'#82d1a0');rect(x,a.y+8,a.w,6,u?'#584a6b':level===2?'#4b9b77':'#6ca582');for(let i=0;i<a.w/22;i++)for(let j=0;j<4;j++)if((i+j*3)%4===0)rect(x+i*22+5,a.y+21+j*19,4,3,u?'#8c7aa3':'#e0b0a2')}
function bridge(a,c1,c2){let x=a.x-cam;rect(x,a.y,a.w,8,c1);rect(x,a.y+8,a.w,3,c2);for(let i=4;i<a.w;i+=12)rect(x+i,a.y+2,2,4,c2)}
function qbrick(b){const used=data.qb.includes(qKey(b));const x=b.x-cam,y=b.y-(b.bump?Math.sin(b.bump/150*Math.PI)*5:0);if(x<-30||x>W+30)return;
 rect(x,y,b.w,b.h,used?'#b9a294':'#f6b64a');rect(x,y,b.w,2,used?'#d2c0b4':'#ffd98a');rect(x,y+b.h-3,b.w,3,used?'#8b7568':'#c97f22');
 if(!used){text('?',x+b.w/2,y+16,'#fff',15,'center')}else{rect(x+5,y+9,12,3,'#8b7568')}}
function coinDraw(x,y){const s=Math.abs(Math.sin(timer/220+x*.05));circle(x,y,6,'#f9c74f');rect(x-1.5*s-1,y-4,3*s+2,8,'#fff1a8');ctx.fillStyle='#f28eaf';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText('♥',x,y+3);ctx.textAlign='left'}
function platDraw(pl){const x=pl.x-cam;if(x<-80||x>W+80)return;
 if(pl.kind==='mover'){const y=pl.y;circle(x+10,y+4,10,'#f2fbff');circle(x+pl.w/2,y-1,13,'#fff');circle(x+pl.w-10,y+4,10,'#f2fbff');rect(x,y+2,pl.w,9,'#eef8ff');rect(x+4,y+10,pl.w-8,3,'#a6d4eb')}
 if(pl.kind==='fall'){const sh=pl.t>0&&pl.t<450?Math.sin(timer/25)*1.5:0;rect(x+sh,pl.y,pl.w,9,'#c69468');rect(x+sh,pl.y+9,pl.w,3,'#8d6248');for(let i=6;i<pl.w;i+=14)rect(x+sh+i,pl.y+2,2,5,'#8d6248')}
 if(pl.kind==='spring'){const sq=pl.anim?4:0;rect(x+9,pl.y+6,8,14-sq,'#f5e6d3');rect(x+1,pl.y+sq,pl.w-2,8,'#e8577f');circle(x+7,pl.y+3+sq,2.2,'#fff');circle(x+18,pl.y+4+sq,2,'#fff')}}
function pipeDraw(o){const x=o.x-cam;if(x<-60||x>W+60)return;rect(x,o.top+5,o.w,G-o.top-5,'#4bba83');rect(x+4,o.top+5,5,G-o.top-5,'#7cdda0');rect(x-5,o.top,o.w+10,10,'#7cdda0');rect(x-5,o.top+8,o.w+10,2,'#3f9a6c');
 if(o.type==='pipe'&&!o.exit&&!data.seed){circle(x+o.w/2,o.top-14+Math.sin(timer/250)*2,6,'#fff1a8');text('跳上管道',x+o.w/2,o.top-26,'#fff',11,'center')}
 if(o.exit&&data.seed){text('⬇ 出口',x+o.w/2,o.top-12,'#fff',11,'center')}}
function enemyDraw(e){const x=e.x-cam;if(x<-40||x>W+40)return;
 if(e.type==='fly'){const wing=Math.sin(timer/80)*5;circle(x-7,e.y-3,7+wing*.2,'#ffb3d1');circle(x+7,e.y-3,7+wing*.2,'#ffb3d1');rect(x-2,e.y-8,4,16,'#6b4d6e');if(sleeping)text('z',x+10,e.y-12,'#fff',10);return}
 const by=G-e.hop;
 if(e.dead){rect(x-12,G-6,24,6,e.type==='frog'?'#5fae6a':level===1?'#e2665e':level===0?'#c96b52':'#b978b0');return}
 if(e.type==='frog'){circle(x,by-10,11,'#6cc27a');circle(x-6,by-20,4,'#6cc27a');circle(x+6,by-20,4,'#6cc27a');circle(x-6,by-20,2,'#2d2d3a');circle(x+6,by-20,2,'#2d2d3a');rect(x-5,by-7,10,2,'#2f7a4a')}
 else if(level===1){circle(x,by-9,11,'#e2665e');rect(x-15,by-14,6,4,'#e2665e');rect(x+9,by-14,6,4,'#e2665e');circle(x-4,by-14,2,'#fff');circle(x+4,by-14,2,'#fff')}
 else if(level===0){rect(x-6,by-9,12,9,'#fbe8d2');circle(x,by-12,11,'#c96b52');circle(x-4,by-15,2.5,'#fff3e6');circle(x+5,by-13,2,'#fff3e6');rect(x-4,by-6,2,2,'#4b3c51');rect(x+2,by-6,2,2,'#4b3c51')}
 else{circle(x,by-12,12,'#b978b0');if(sleeping){rect(x-7,by-15,5,2,'#fff');rect(x+2,by-15,5,2,'#fff')}else{circle(x-5,by-15,2,'#fff');circle(x+5,by-15,2,'#fff')}}
 if(sleeping)text('z',x+10,by-26,'#fff',10)}
function sign(o){const x=o.x-cam;if(x<-140||x>W+140)return;rect(x-2,G-30,4,30,'#8d647b');ctx.font='bold 11px sans-serif';const w=ctx.measureText(o.text).width+12;rect(x-w/2,G-50,w,20,'#fff7ec');rect(x-w/2,G-31,w,2,'#e0b0a2');text(o.text,x,G-36,'#7b4d6e',11,'center')}
function bunny(x,y,face,sit,dead){x=Math.round(x);y=Math.round(y);const s=sit?4:0;
 const ex=face<0?-2:0;
 rect(x+4,y-8+s,5,15,'#fffaf6');rect(x+13,y-9+s,5,16,'#fffaf6');rect(x+6,y-5+s,2,9,'#ef9fba');rect(x+15,y-6+s,2,9,'#ef9fba');rect(x+2,y+5+s,20,18-s,'#fffaf6');
 if(dead){rect(x+5+ex,y+12,4,1,'#4b3c51');rect(x+15+ex,y+12,4,1,'#4b3c51');rect(x+6+ex,y+10,2,5,'#4b3c51');rect(x+16+ex,y+10,2,5,'#4b3c51')}
 else{rect(x+6+ex,y+12+s,3,3,'#4b3c51');rect(x+16+ex,y+12+s,3,3,'#4b3c51')}
 rect(x+11+ex,y+17+s,4,2,'#e58baa');rect(x+3,y+21,19,4,'#ed85ab');if(!sit){rect(x+3,y+25,6,3,'#fffaf6');rect(x+16,y+25,6,3,'#fffaf6')}else{rect(x,y+24,8,3,'#fffaf6');rect(x+16,y+24,8,3,'#fffaf6')}}
function lionDraw(x,y,face,sit){x=Math.round(x);y=Math.round(y);const s=sit?3:0,ex=face<0?-2:1;circle(x+12,y+11+s,13,'#92603d');rect(x+3,y+17+s,19,10-s,'#c89158');circle(x+12,y+11+s,9,'#f4c28d');circle(x+4,y+3+s,5,'#92603d');circle(x+21,y+3+s,5,'#92603d');rect(x+7+ex,y+10+s,3,3,'#493b50');rect(x+15+ex,y+10+s,3,3,'#493b50');rect(x+11+ex,y+16+s,4,3,'#7b4d53');rect(x+7,y+21+s,11,4,'#e7839b');rect(x+3,y+25,7,3,'#f4c28d');rect(x+17,y+25,7,3,'#f4c28d')}
function bubble(x,y,t){ctx.font='bold 11px sans-serif';const w=ctx.measureText(t).width+14;rect(x-w/2,y-22,w,20,'#fff');rect(x-3,y-3,6,4,'#fff');text(t,x,y-8,'#7b4d6e',11,'center')}
function heart(x,y){circle(x-5,y-2,6,'#f26d9e');circle(x+5,y-2,6,'#f26d9e');ctx.fillStyle='#f26d9e';ctx.beginPath();ctx.moveTo(x-11,y);ctx.lineTo(x,y+12);ctx.lineTo(x+11,y);ctx.fill()}
function seedDraw(x,y){const b=Math.sin(timer/300)*2;circle(x,y+b,11,'#fff6b0');circle(x,y+b,7,'#a5d66f');rect(x-1,y-10+b,2,6,'#5fae6a');circle(x+4,y-10+b,3,'#8bd06b')}
function cloudDraw(c){let x=c.x-cam,y=G-4;circle(x+9,y+4,10,'#eaf8ff');circle(x+c.w/2,y-2,13,'#fff');circle(x+c.w-9,y+4,10,'#eaf8ff');rect(x,y+2,c.w,9,'#eaf8ff');rect(x+4,y+10,c.w-8,3,'#a6d4eb')}
function draw(){
 if(!L){ctx.fillStyle='#2a203f';ctx.fillRect(0,0,W,H);return}
 bg();L.trees.forEach(tree);
 for(const o of L.objects)if(o.type==='exitpipe')pipeDraw(o);
 L.map.forEach(terrain);clouds.forEach(cloudDraw);
 if(level===1&&!L.under)for(let i=0;i<3;i++)if(data.stars.includes(i))bridge({x:1410+i*49,y:G,w:51},'#ffe9a6','#e8b85c');
 if(level===2&&!L.under&&(data.story.bridge||(scene&&scene.type==='switch'&&scene.rise>0))){const r=data.story.bridge?1:Math.max(0,scene.rise);bridge({x:1500,y:G+(1-r)*70,w:55},'#c99a6b','#8d6248')}
 if(!L.under)for(let i=1;i<L.cps.length;i++){let x=L.cps[i]-cam;if(x<-30||x>W+30)continue;rect(x,G-62,4,62,'#8b6a85');rect(x+4,G-62,18,12,data.cpLevel===level&&data.cp>=i?'#f28eaf':'#ffe5a1')}
 for(const o of L.objects)if(o.type==='sign')sign(o);
 L.plats.forEach(platDraw);L.boxes.forEach(qbrick);
 for(const o of L.objects){let x=o.x-cam;if(x<-60||x>W+60)continue;
  if(o.type==='coin'&&!data.coins.includes(cKey(o)))coinDraw(x,o.y);
  if(o.type==='heart'&&!data.hearts[level])heart(x,o.y+Math.sin(timer/300)*2);
  if(o.type==='seed'&&!data.seed)seedDraw(x,o.y);
  if(o.type==='star'&&!data.stars.includes(o.id)){circle(x,o.y,9,'#ffe3a2');rect(x-2,o.y-13,4,26,'#fff6c4');rect(x-13,o.y-2,26,4,'#fff6c4')}
  if(o.type==='shell'&&!data.shells.includes(o.id)){circle(x,o.y-2,6,'#ffd7a4');rect(x-5,o.y,10,3,'#e9a88f')}
  if(o.type==='switch'){const down=data.story.bridge||(scene&&scene.type==='switch'&&scene.pressed);rect(x,G-(down?6:12),28,down?6:12,'#a1a2d5');circle(x+14,G-(down?8:14),6,down?'#8be0a4':'#ffcf6e');if(!down)text('双人机关',x+14,G-30,'#4b3c51',11,'center')}}
 const pipeOver=scene&&(scene.type==='pipeIn'||scene.type==='pipeOut'||scene.type==='rise');
 if(!pipeOver)for(const o of L.objects)if(o.type==='pipe')pipeDraw(o);
 L.enemies.forEach(enemyDraw);
 if(!L.under){if(level===0&&!data.met){lionDraw(350-cam,G-28,-1,false);circle(363-cam,G-56,10,'#fff6e8');text('!',359-cam,G-51,'#9d6492',14)}else lionDraw(lion.x-cam,lion.y,lion.face,lion.sit)}
 if(!p.hidden)bunny(p.x-cam,p.y,p.face,p.sit,!!dying);
 if(pipeOver){for(const o of L.objects)if(o.type==='pipe'||o.type==='exitpipe')pipeDraw(o)}
 if(bubbleMsg&&scene)bubble(lion.x-cam+12,lion.y-6,bubbleMsg.t);
 for(const q of L.pops){const a=1-q.t/600;ctx.globalAlpha=Math.max(0,a);if(q.txt)text(q.txt,q.x-cam,q.y-q.t*.03,'#fff',11,'center');else coinDraw(q.x-cam,q.y-q.t*.05);ctx.globalAlpha=1}
 if(!L.under&&level!==1){rect(L.end-70-cam,G-90,5,90,'#fff4e4');rect(L.end-65-cam,G-90,48,24,'#f18eb2');text('终点',L.end-59-cam,G-73,'#fff',13)}
 for(const r of rockets){if(!r.parts){rect(r.x-1,r.y,2,7,r.c);ctx.globalAlpha=.4;rect(r.x-1,r.y+7,2,10,r.c);ctx.globalAlpha=1}else for(const q of r.parts)if(q.life>0){ctx.globalAlpha=Math.max(0,q.life);circle(q.x,q.y,2.4,r.c);ctx.globalAlpha=Math.max(0,q.life*.4);circle(q.x-q.vx*2,q.y-q.vy*2,1.6,r.c);ctx.globalAlpha=1}}
 if(scene&&scene.type==='sunset'&&scene.t>1500&&scene.t<6000){ctx.globalAlpha=Math.min(1,(scene.t-1500)/600,(6000-scene.t)/600);text('太阳慢慢落进海里……',W/2,58,'#fff',15,'center');ctx.globalAlpha=1}
 if(scene&&scene.type==='fireworks'&&scene.t<3000){ctx.globalAlpha=Math.min(1,scene.t/600,(3000-scene.t)/600);text('花火大会开始啦！',W/2,58,'#fff',15,'center');ctx.globalAlpha=1}
 if(toast&&timer<toast.until&&mode==='play'){ctx.font='bold 14px sans-serif';const w=ctx.measureText(toast.t).width+20;rect(W/2-w/2,48,w,26,'#00000055');text(toast.t,W/2,66,'#fff',14,'center')}
 if(fade.a>0){ctx.globalAlpha=fade.a;rect(0,0,W,H,'#1c1530');if(fade.text){text(fade.text,W/2,H/2,'#ffd6e6',15,'center')}ctx.globalAlpha=1}
 $('#hud').textContent='❤️ '+data.hearts.filter(Boolean).length+'/3　🌱 '+(data.seed?1:0)+'/1　🪙 '+data.coins.length+'　'+(L.under?'地下花园':LEVELS[level])+(level===1?'　🐚 '+data.shells.length+'/5　⭐ '+data.stars.length+'/3':'')}
function loop(t){try{let dt=Math.min(40,t-last||16);last=t;
 if(mode==='play')update(dt);else if(mode==='scene'&&scene)updateScene(dt);else if(mode==='dying'&&dying)updateDying(dt);
 updateFade(dt);draw()}catch(e){$('#error').style.display='block';$('#error').textContent='游戏运行异常：'+e.message+'。请截图反馈。';return}requestAnimationFrame(loop)}

// ================= Interact =================
function interact(){if(mode!=='play')return;
 if(L.under){if(data.seed&&onPipeTop(PIPE()))startScene('pipeOut',{pipe:PIPE()});return}
 if(level===1&&!data.story.sunset&&p.x>=535){startScene('sunset');return}
 if(level===2&&!data.seed&&onPipeTop(PIPE())){startScene('pipeIn',{pipe:PIPE()})}}

// ================= Gate (welcome + anniversary date) =================
function parseDate(v){const d=(v||'').replace(/[^0-9]/g,'');if(d.length===4)return d==='1113';if(d.length===8)return d.slice(4)==='1113';return false}
let wrong=0;
function showGate(step){mode='gate';showUI(false);$('#shade').classList.add('hide');$('#gate').classList.remove('hide');$('#gate-welcome').classList.toggle('hide',step!=='welcome');$('#gate-date').classList.toggle('hide',step!=='date');if(step==='date'){$('#gate-msg').textContent='';setTimeout(()=>{try{$('#gate-input').focus()}catch(e){}},50)}}
function passGate(){try{localStorage.setItem(GATE,'1')}catch(e){}$('#gate-input').blur();$('#gate').classList.add('hide');mode='menu';home()}
$('#gate-enter').addEventListener('click',()=>gateOk()?passGate():showGate('date'));
$('#gate-date').addEventListener('submit',e=>{e.preventDefault();const v=$('#gate-input').value;
 if(parseDate(v)){$('#gate-msg').textContent='答对啦 ♡';setTimeout(passGate,350)}
 else{wrong++;$('#gate-msg').textContent=wrong>=3?'提示：是 11 月的某一天，输入 4 位数字，比如 0101':'再想想～是我们在一起的那一天哦';const c=$('#gate-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}});
$('#gate-input').addEventListener('input',e=>{const t=e.target;t.value=t.value.replace(/[^0-9]/g,'').slice(0,8)});

// ================= Input =================
['left','right','jump'].forEach(key=>{let el=$('#'+key);function down(e){e.preventDefault();if(mode!=='play')return;try{el.setPointerCapture(e.pointerId)}catch(_){}held[key]=true;el.classList.add('pressed');if(key==='jump')jumpQueue=true}function up(e){e.preventDefault();held[key]=false;el.classList.remove('pressed')}el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)});
// Pause / interact react on touch-down so they work even while another finger holds a direction key
$('#pause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pause()});
$('#interact').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();interact()});
window.addEventListener('keydown',e=>{if(mode==='gate')return;if(['ArrowLeft','ArrowRight','Space','ArrowUp','Escape','KeyE'].includes(e.code))e.preventDefault();if(e.code==='Escape'){if(mode==='play')pause();return}if(mode!=='play')return;if(e.code==='KeyE'){interact();return}if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if((e.code==='Space'||e.code==='ArrowUp')&&!held.jump){held.jump=true;jumpQueue=true}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false;if(e.code==='Space'||e.code==='ArrowUp')held.jump=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
window.addEventListener('blur',()=>{if(mode==='play')pause()});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
// block page scrolling, except inside the text card (long text can scroll)
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#card'))return;if(e.cancelable)e.preventDefault()},{passive:false});
function size(){let vh=window.visualViewport?window.visualViewport.height:window.innerHeight,vw=window.visualViewport?window.visualViewport.width:window.innerWidth;vh=Math.max(200,vh);vw=Math.max(300,vw);document.documentElement.style.setProperty('--available-height',vh+'px');
 W=Math.max(560,Math.min(1000,Math.round(360*vw/vh)));if(canvas.width!==W){canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false}if(L)cam=Math.max(0,Math.min(L.end-W,cam))}
window.addEventListener('resize',size);window.addEventListener('orientationchange',()=>setTimeout(size,300));if(window.visualViewport)window.visualViewport.addEventListener('resize',size);
load();layout(Math.min(2,data.level));respawnAt(L.cps[data.cpLevel===level?Math.min(L.cps.length-1,data.cp):0]);size();setTimeout(size,500);
showGate('welcome');requestAnimationFrame(loop);

})();
</script></body></html>
