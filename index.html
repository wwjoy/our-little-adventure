function surfaces(){

 if(level===2&&!L.under){arr.push({x:1430,y:G-38,w:65,h:38,kind:'block',box:true});if(data.story.bridge)arr.push({x:1500,y:G,w:55,kind:'bridge'});}
 for(const pl of L.plats){if(pl.kind==='fall'&&pl.y>H+40)continue;arr.push({x:pl.x,y:pl.y,w:pl.w,h:pl.kind==='spring'?14:10,kind:pl.kind,box:pl.kind==='spring',ref:pl})}
 return arr}
function onFloor(x){return L.map.some(a=>a.kind==='ground'&&x+p.w>a.x+4&&x<a.x+a.w-4)}
function insideBox(x){return surfaces().some(a=>a.box&&a.y<G-8&&a.y+a.h>G-p.h&&x+p.w>a.x&&x<a.x+a.w)}
function safeX(x){
 // Prefer a safe spot BEHIND the checkpoint; never cross a gap while searching.
 const ground=L.map.filter(a=>a.kind==='ground'&&x>=a.x-12&&x<=a.x+a.w+12).sort((a,b)=>Math.abs(x-(a.x+a.w/2))-Math.abs(x-(b.x+b.w/2)))[0];

function restoreUnclaimedRewards(){
 // A struck brick stays used, but its uncollected prize must never disappear on death/reload.
 if(!L)return;
 for(const b of L.boxes){
  const key=qKey(b),r=b.reward||'coin';
  if(!data.qb.includes(key))continue;
  if((r==='keepsake'&&!data.keepsakes.includes(key))||(r==='gift'&&!data.gifts.includes(key))||(r==='snowboard'&&!data.snowboard)){
   if(!pickups.some(a=>a.key===key))pickups.push({x:b.x+11,y:b.y-27,baseY:b.y-14,kind:r,key,life:500});
  }
  if(r==='key'&&!data.keys.includes(key)){
   // Recover a previously opened key brick from older saves.
   data.keys.push(key);save();
  }
 }
}

function checkpoint(i){
 if(i<=0||L.under||i>=L.cps.length)return;
 // Only the movement system can confirm a flag: crossing it, then landing safely.
 if(data.cpLevel!==level||data.cp<i){
  data.cp=i;data.cpLevel=level;save();
  flash('✨ 小旗子已点亮，冒险进度已保存 ♡');
 }
 pendingFlag=-1;
}
function updateFlags(prevX){
 if(L.under)return;
 const previous=data.cpLevel===level?data.cp:0;
 // Crossing the flag with the bunny's center, even high above the flag, arms it.
 // No flag may be armed just because a respawn placed the bunny nearby.
 const before=prevX+p.w/2,now=p.x+p.w/2;
 if(now>before){
  for(let i=previous+1;i<L.cps.length;i++){
   const fx=L.cps[i];
   if(before<fx&&now>=fx)pendingFlag=Math.max(pendingFlag,i);
  }
 }
 // The player must land safely after crossing. Falling into a pit cancels it.
 if(pendingFlag>previous&&p.on&&onFloor(p.x)&&p.y+p.h<=G+2){
  checkpoint(pendingFlag);
 }
}

function findGap(x){const g=L.map.filter(a=>a.kind==='ground').sort((a,b)=>a.x-b.x);let best=null,bd=1e9;for(let i=0;i<g.length-1;i++){const s=g[i].x+g[i].w,e=g[i+1].x;if(e-s<8)continue;const d=x<s?s-x:x>e?x-e:0;if(d<bd){bd=d;best={id:LK()+'-'+i,x:s,w:e-s}}}return bd<200?best:null}

function updateDying(dt){const k=Math.min(2,dt/16.667);dying.t+=dt;
 if(dying.cause==='enemy'&&dying.t>250){p.vy=Math.min(9,p.vy+.4*k);p.y+=p.vy*k}
 const wait=dying.cause==='enemy'?1050:350;
 if(dying.t>wait&&fade.dir===0)fadeTo(()=>{const c=dying.cause,x=dying.x;dying=null;failure(c,x)},'哎呀～回到小旗子那里再试一次');}
function failure(cause,x){

 respawnAt(L.cps[cp]);play();
 if(!assist)return;
 if(failCount===3){
  if(cause==='fall'){const gap=findGap(x);if(gap&&!clouds.some(c=>c.id===gap.id))
   menu('🦁 要小狮子帮忙吗？','小狮子可以在<strong>刚才掉下去的地方</strong>搭一朵云桥，只帮这一处。',[['好呀 ♡',()=>{clouds.push(gap);play()}],['再试试',play]])}
  else if(!sleeping) menu('🦁 要小狮子帮忙吗？','小狮子可以唱一首摇篮曲，让小怪们先睡一会儿。',[['好呀 ♡',()=>{sleeping=true;play()}],['再试试',play]]);
 } else if(failCount===5){
  const gap=cause==='fall'?findGap(x):null;
  menu('🦁 我们一起过去吧','可以让小狮子帮你搭好刚才的云桥，但仍需要自己走过这段路。',[["帮我搭桥",()=>{if(gap&&!clouds.some(c=>c.id===gap.id))clouds.push(gap);else sleeping=true;respawnAt(L.cps[cp]);failCount=0;play()}],['继续挑战',play]]);
 }}

 // Continuous half-pipe surface: smooth at the seams, with a broad valley and rising lips.
 function snowGround(x){
  const phase=2*Math.PI*x/720;
  return 249-45*Math.cos(phase);
 }
 function snowSlope(x){return (snowGround(x+2)-snowGround(x-2))/4}
 function snowNormal(x){return Math.atan(snowSlope(x))}
 function snowObstacle(x,screenX){
  // All geometry is drawn in slope-local coordinates, so it rests perpendicular to the snow.
  const gy=snowGround(x), angle=snowNormal(x);
  ctx.save();ctx.translate(screenX,gy);ctx.rotate(angle);
  // Rounded snowdrift rather than a floating rectangular obstacle.
  ctx.fillStyle='#a9d7eb';ctx.beginPath();ctx.moveTo(-14,0);
  ctx.quadraticCurveTo(-12,-12,-7,-15);ctx.quadraticCurveTo(-2,-23,4,-17);
  ctx.quadraticCurveTo(12,-15,14,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f7fcff';ctx.beginPath();ctx.moveTo(-13,-5);
  ctx.quadraticCurveTo(-9,-16,-3,-14);ctx.quadraticCurveTo(3,-24,8,-13);
  ctx.quadraticCurveTo(13,-9,13,-5);ctx.closePath();ctx.fill();
  ctx.restore();
 }
function updateSnow(dt){
 if(!snow)return;
 const s=snow,k=Math.min(.04,dt/1000),ground=snowGround(s.distance);
 if(jumpQueue){if(s.onGround){s.airVy=-300;s.onGround=false;s.airY=ground-4}jumpQueue=false}
 if(!s.onGround){s.airVy+=720*k;s.airY+=s.airVy*k;if(s.airY>=snowGround(s.distance)){s.airY=snowGround(s.distance);s.onGround=true;s.airVy=0;for(let i=0;i<9;i++)s.particles.push({x:s.distance,y:s.airY,vx:-35-Math.random()*65,vy:-20-Math.random()*55,life:.5})}}
 // Downhill speeds up, uphill slows down. Keep a forgiving minimum speed.
 const slope=snowSlope(s.distance);s.speed=Math.max(105,Math.min(195,s.speed+slope*105*k));
 const before=s.distance;s.distance+=s.speed*k;
 if(s.onGround)s.airY=snowGround(s.distance);
 s.angle=Math.atan(snowSlope(s.distance));
 const feet=s.onGround?snowGround(s.distance):s.airY;
 for(let i=0;i<SNOW_FLAKES.length;i++){const x=SNOW_FLAKES[i];if(!s.flakes.has(i)&&Math.abs(s.distance-x)<17&&Math.abs(feet-(snowGround(x)-45))<40)s.flakes.add(i)}
 for(const x of SNOW_OBSTACLES){if(before<x+12&&s.distance>=x-12&&s.distance<x+16&&feet>snowGround(x)-24){snowFail();return}}
 if(s.onGround&&Math.random()<.8)s.particles.push({x:s.distance-14,y:feet,vx:-35-Math.random()*55,vy:-15-Math.random()*20,life:.4});
 for(const q of s.particles){q.x+=q.vx*k;q.y+=q.vy*k;q.vy+=90*k;q.life-=k}s.particles=s.particles.filter(q=>q.life>0).slice(-90);
 if(s.distance>=SNOW_FINISH_X){snowFinish();return}
}

 text('❄ 未来的冬天',18,29,'#426b88',20);text('🏂 跳过雪堆 · ❄ '+s.flakes.size+'/'+SNOW_FLAKES.length,18,53,'#426b88',12);

function draw(){
 if(scene&&(scene.type==='snow'||scene.type==='snowEnding')){drawSnow();return}
 if(scene&&scene.type==='plant'){
  scene.visibleFrames=(scene.visibleFrames||0)+1;
  const t=scene.t;
  const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#f7c8e1');grad.addColorStop(1,'#d5f1ce');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  rect(0,G,W,H-G,'#b9897e');rect(0,G,W,9,'#7bcaa0');
  const cx=W/2;
  const growth=Math.max(0,Math.min(1,(t-1800)/3900));
  if(t>850){rect(cx-12,G-6,24,7,'#765746');circle(cx,G-8,5,'#9b6a55')}
  if(t>1500){rect(cx-3,G-8-growth*100,6,100*growth,'#926b61');
   for(let i=0;i<9;i++){const a=i*2.4,rr=17+growth*34;circle(cx+Math.sin(a)*rr*.8,G-108*growth+Math.cos(a)*rr*.42,Math.max(2,growth*22),i%2?'#f7a4c8':'#ffcfdf')}}
  bunny(cx-66,G-27,1,true,false);lionDraw(cx+40,G-27,-1,true);
  text(t<1700?'一起种下未来的种子 ♡':t<5600?'愿我们的故事慢慢开花 ♡':'我们的第一个365天',W/2,66,'#7b4d6e',20,'center');
  return;
 }
 if(!L){ctx.fillStyle='#2a203f';ctx.fillRect(0,0,W,H);return}
 bg();L.trees.forEach(tree);
 if(level===1&&!L.under){
  for(let i=0;i<19;i++){const sx=((i*91-cam*.24)%(W+110)+(W+110))%(W+110)-45;rect(sx,253+i%4*7,26+i%3*7,2,'#f6d3bd')}
  if(scene&&(scene.type==='sunset'||scene.type==='fireworks')){
   rect(0,G-8,W,H-G+8,'#efcf9e');for(let i=0;i<35;i++)rect((i*47-cam*.18+W*3)%W,G+5+i%4*9,5,2,'#f7e6c4')}
 }
 for(const o of L.objects)if(o.type==='exitpipe')pipeDraw(o);
 L.map.forEach(terrain);clouds.forEach(cloudDraw);
 if(level===1&&!L.under)for(let i=0;i<3;i++)if(data.stars.includes(i))bridge({x:1410+i*49,y:G,w:51},'#ffe9a6','#e8b85c');
 if(level===2&&!L.under&&(data.story.bridge||(scene&&scene.type==='switch'))){const r=data.story.bridge?1:Math.min(1,coop.bridgeTime/2000);bridge({x:1500,y:G+(1-r)*70,w:55},'#c99a6b','#8d6248')}
 if(!L.under&&!L.secret)for(let i=1;i<L.cps.length;i++){let x=L.cps[i]-cam;if(x<-30||x>W+30)continue;rect(x,G-62,4,62,'#8b6a85');rect(x+4,G-62,18,12,data.cpLevel===level&&data.cp>=i?'#f28eaf':'#ffe5a1')}
 for(const o of L.objects)if(o.type==='sign')sign(o);
 if(level===1&&!L.under&&!L.secret){
  const px=1812-cam;rect(px,G-5,42,5,coastCoop.phase?'#ffcf87':'#e9a2b2');
  const rx=1860-cam;rect(rx,G-64,3,64,'#94777d');circle(rx+1,G-66,5,'#ffe5b6');
  if(coastCoop.phase>0){ctx.strokeStyle='#e7cfac';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(rx,G-64);ctx.lineTo(1910-cam,G-13);ctx.stroke()}
  if(coastCoop.phase===0&&p.x>1650&&p.x<1850)text('♡',px+20,G-16,'#fff4d8',14,'center');
 }
 L.plats.forEach(platDraw);L.boxes.forEach(qbrick);pickups.forEach(pickupDraw);if(L.secret&&data.snowboard){const bx=330-cam;rect(bx-20,G-17,40,5,'#f3a3c9');rect(bx-16,G-19,32,2,'#fff');rect(bx-9,G-22,5,5,'#80bdd5');rect(bx+5,G-22,5,5,'#80bdd5');}
 for(const o of L.objects){let x=o.x-cam;if(x<-60||x>W+60)continue;
  if(o.type==='coin'&&!data.coins.includes(cKey(o)))coinDraw(x,o.y);
  if(o.type==='heart'&&!data.hearts[level])heart(x,o.y+Math.sin(timer/300)*2);
  if(o.type==='seed'&&!data.seed)seedDraw(x,o.y);
  if(o.type==='star'&&!data.stars.includes(o.id)){circle(x,o.y,9,'#ffe3a2');rect(x-2,o.y-13,4,26,'#fff6c4');rect(x-13,o.y-2,26,4,'#fff6c4')}
  if(o.type==='shell'&&!data.shells.includes(o.id)){circle(x,o.y-2,6,'#ffd7a4');rect(x-5,o.y,10,3,'#e9a88f')}
  if(o.type==='switch'){
    const pinkX=coop.lionX-cam, yellowX=1450-cam;
    const lionOn=data.story.bridge||coop.lionReady||coop.state==='raising';
    const bunnyOn=data.story.bridge||coop.state==='raising';
    // A raised, solid platform makes the bunny's half an actual jump challenge.
    rect(1430-cam,G-38,65,38,'#b8877e');rect(1430-cam,G-38,65,8,'#82d1a0');
    rect(pinkX,G-8,28,8,lionOn?'#f78cb8':'#b57899');
    rect(yellowX,G-46,28,8,bunnyOn?'#ffe17e':'#c2a967');
    text('🩷',pinkX+14,G-18,'#fff',13,'center');text('💛',yellowX+14,G-56,'#fff',13,'center');
    if(!data.story.bridge&&coop.state==='waiting')text('跳上高台，踩住黄色机关！',yellowX-18,G-77,'#62445f',11,'center');
    else if(!data.story.bridge&&coop.state==='idle')text('双人机关',yellowX-14,G-77,'#62445f',11,'center');
    if(coop.state==='raising'){
      const t=Math.min(1,coop.bridgeTime/900);ctx.globalAlpha=t;
      rect(pinkX+10,G-78,3,70,'#ff9fc7');rect(yellowX+11,G-116,3,70,'#ffe17e');
      heart((pinkX+yellowX)/2+15,G-124);ctx.globalAlpha=1;
    }
   }}
 const pipeOver=scene&&(scene.type==='pipeIn'||scene.type==='pipeOut'||scene.type==='rise');
 if(!pipeOver)for(const o of L.objects)if(o.type==='pipe')pipeDraw(o);
 L.enemies.forEach(enemyDraw);
 if(!L.under){if(level===0&&!data.met){lionDraw(350-cam,G-28,-1,false);circle(363-cam,G-56,10,'#fff6e8');text('!',359-cam,G-51,'#9d6492',14)}else lionDraw(lion.x-cam,lion.y,lion.face,lion.sit)}
 if(!p.hidden)bunny(p.x-cam,p.y,p.face,p.sit,!!dying);
 if(pipeOver){for(const o of L.objects)if(o.type==='pipe'||o.type==='exitpipe')pipeDraw(o)}
 if(bubbleMsg&&scene)bubble(lion.x-cam+12,lion.y-6,bubbleMsg.t);
 for(const q of L.pops){const a=1-q.t/600;ctx.globalAlpha=Math.max(0,a);if(q.txt)text(q.txt,q.x-cam,q.y-q.t*.03,'#fff',11,'center');else coinDraw(q.x-cam,q.y-q.t*.05);ctx.globalAlpha=1}
 if(level===0&&!L.under&&!L.secret){
   const dx=DOOR_X-cam;
   if(dx>-40&&dx<W+40){
    // Before finding the key, the secret entrance is part of the scenery, not a visible locked door.
    if(!doorUnlocked()){
      ctx.globalAlpha=.40;circle(dx+12,G-45,3,'#eaf9ff');circle(dx+17,G-41,2,'#f7ffff');ctx.globalAlpha=1;
    }else if(doorRevealed()){
      const proximity=Math.abs(p.x+11-(DOOR_X+12));
      const alpha=data.secretDoors.includes('0-secret-door')?1:Math.max(.18,Math.min(1,(105-proximity)/65));
      ctx.save();ctx.globalAlpha=alpha;
      rect(dx-3,G-52,30,52,'#f6e8fa');rect(dx,G-49,24,49,'#9ccfbf');
      rect(dx+4,G-43,16,39,'#d8f5e9');rect(dx+18,G-26,3,4,'#f4cf80');
      circle(dx+12,G-56,3,'#fff7cb');ctx.restore();
    }
   }
  }
 if(!L.under&&!L.secret&&level!==1){rect(L.end-70-cam,G-90,5,90,'#fff4e4');rect(L.end-65-cam,G-90,48,24,'#f18eb2');text('终点',L.end-59-cam,G-73,'#fff',13)}
 for(const r of rockets){if(!r.parts){rect(r.x-1,r.y,2,7,r.c);ctx.globalAlpha=.4;rect(r.x-1,r.y+7,2,10,r.c);ctx.globalAlpha=1}else for(const q of r.parts)if(q.life>0){ctx.globalAlpha=Math.max(0,q.life);circle(q.x,q.y,2.4,r.c);ctx.globalAlpha=Math.max(0,q.life*.4);circle(q.x-q.vx*2,q.y-q.vy*2,1.6,r.c);ctx.globalAlpha=1}}
 if(scene&&scene.type==='sunset'&&scene.t>1500&&scene.t<6000){ctx.globalAlpha=Math.min(1,(scene.t-1500)/600,(6000-scene.t)/600);text('太阳慢慢落进海里……',W/2,58,'#fff',15,'center');ctx.globalAlpha=1}
 if(scene&&scene.type==='fireworks'&&scene.t<3000){ctx.globalAlpha=Math.min(1,scene.t/600,(3000-scene.t)/600);text('花火大会开始啦！',W/2,76,'#fff4dc',25,'center');ctx.globalAlpha=1}
 if(toast&&timer<toast.until&&mode==='play'){ctx.font='bold 14px sans-serif';const w=ctx.measureText(toast.t).width+20;rect(W/2-w/2,48,w,26,'#00000055');text(toast.t,W/2,66,'#fff',14,'center')}
 if(fade.a>0){ctx.globalAlpha=fade.a;rect(0,0,W,H,'#1c1530');if(fade.text){text(fade.text,W/2,H/2,'#ffd6e6',15,'center')}ctx.globalAlpha=1}
 $('#hud').textContent='❤️ '+data.hearts.filter(Boolean).length+'/3　🌱 '+(data.seed?1:0)+'/1　🪙 '+data.coins.length+'　'+(L.secret?'秘密小屋':L.under?'地下花园':LEVELS[level])+(level===1?'　🐚 '+data.shells.length+'/5　⭐ '+data.stars.length+'/3':'')}
function loop(t){try{let dt=Math.min(40,t-last||16);last=t;
 if(mode==='play')update(dt);else if(mode==='scene'&&scene)updateScene(dt);else if(mode==='dying'&&dying)updateDying(dt);
 updateFade(dt);draw()}catch(e){$('#error').style.display='block';$('#error').textContent='游戏运行异常：'+e.message+'。请截图反馈。';return}requestAnimationFrame(loop)}

// ================= Interact =================
function interact(){if(mode==='scene'&&scene&&scene.type==='plant')return;if(mode!=='play')return;
 if(L.secret){if(p.x>555){exitSecretRoom();return}if(data.snowboard&&p.x>305&&p.x<355){startSnow();return}return}
 if(L.under){if(data.seed&&onPipeTop(PIPE()))startScene('pipeOut',{pipe:PIPE()});return}
 if(level===0&&p.x>1374&&p.x<1425&&doorRevealed()){enterSecretRoom();return}
 if(level===1&&!data.story.sunset&&p.x>=535){startScene('sunset');return}
 if(level===2&&!data.seed&&onPipeTop(PIPE())){startScene('pipeIn',{pipe:PIPE()})}}

// ================= Gate (welcome + anniversary date) =================
function parseDate(v){const d=(v||'').replace(/[^0-9]/g,'');if(d.length===4)return d==='1113';if(d.length===8)return d.slice(4)==='1113';return false}
let wrong=0;
function showGate(step){mode='gate';showUI(false);$('#shade').classList.add('hide');$('#gate').classList.remove('hide');$('#gate-welcome').classList.toggle('hide',step!=='welcome');$('#gate-date').classList.toggle('hide',step!=='date');if(step==='date'){$('#gate-msg').textContent='';setTimeout(()=>{try{$('#gate-input').focus()}catch(e){}},50)}}
function passGate(){try{localStorage.setItem(GATE,'1')}catch(e){}$('#gate-input').blur();$('#gate').classList.add('hide');mode='menu';home()}
$('#gate-enter').addEventListener('click',()=>gateOk()?passGate():showGate('date'));
$('#gate-date').addEventListener('submit',e=>{e.preventDefault();const v=$('#gate-input').value;
 if(parseDate(v)){$('#gate-msg').textContent='答对啦 ♡';setTimeout(passGate,350)}
 else{wrong++;$('#gate-msg').textContent=wrong>=3?'提示：是 11 月的某一天，输入 4 位数字，比如 0101':'再想想～是我们在一起的那一天哦';const c=$('#gate-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}});
$('#gate-input').addEventListener('input',e=>{const t=e.target;t.value=t.value.replace(/[^0-9]/g,'').slice(0,8)});

// ================= Input =================
['left','right','jump'].forEach(key=>{let el=$('#'+key);function down(e){e.preventDefault();if(mode!=='play'&&!(mode==='scene'&&scene&&scene.type==='snow'&&key==='jump'))return;try{el.setPointerCapture(e.pointerId)}catch(_){}held[key]=true;el.classList.add('pressed');if(key==='jump')jumpQueue=true}function up(e){e.preventDefault();held[key]=false;el.classList.remove('pressed')}el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)});
// Pause / interact react on touch-down so they work even while another finger holds a direction key
$('#pause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pause()});
$('#interact').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();interact()});
window.addEventListener('keydown',e=>{if(mode==='gate')return;if(['ArrowLeft','ArrowRight','Space','ArrowUp','Escape','KeyE'].includes(e.code))e.preventDefault();if(e.code==='Escape'){if(mode==='play')pause();return}if(mode!=='play'&&!(mode==='scene'&&scene&&scene.type==='snow'))return;if(e.code==='KeyE'){interact();return}if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if((e.code==='Space'||e.code==='ArrowUp')&&!held.jump){held.jump=true;jumpQueue=true}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false;if(e.code==='Space'||e.code==='ArrowUp')held.jump=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
window.addEventListener('blur',()=>{if(mode==='play')pause()});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,#card'))e.preventDefault()});
document.addEventListener('selectionchange',()=>{if(mode==='play'&&window.getSelection)window.getSelection().removeAllRanges()});
// block page scrolling, except inside the text card (long text can scroll)
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#card'))return;if(e.cancelable)e.preventDefault()},{passive:false});
function size(){let vh=window.visualViewport?window.visualViewport.height:window.innerHeight,vw=window.visualViewport?window.visualViewport.width:window.innerWidth;vh=Math.max(200,vh);vw=Math.max(300,vw);document.documentElement.style.setProperty('--available-height',vh+'px');
 W=Math.max(560,Math.min(1000,Math.round(360*vw/vh)));if(canvas.width!==W){canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false}if(L)cam=Math.max(0,Math.min(L.end-W,cam))}
window.addEventListener('resize',size);window.addEventListener('orientationchange',()=>setTimeout(size,300));if(window.visualViewport)window.visualViewport.addEventListener('resize',size);
load();layout(Math.min(2,data.level));respawnAt(L.cps[data.cpLevel===level?Math.min(L.cps.length-1,data.cp):0]);size();setTimeout(size,500);
showGate('welcome');requestAnimationFrame(loop);

})();
</script></body></html>
