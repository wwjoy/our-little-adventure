 // Continuous half-pipe surface: smooth at the seams, with a broad valley and rising lips.
 function snowGround(x){
  const phase=2*Math.PI*x/720;
  return 249-45*Math.cos(phase);
 }
 function snowSlope(x){return (snowGround(x+2)-snowGround(x-2))/4}
 function snowNormal(x){return Math.atan(snowSlope(x))}
 function snowObstacle(x,screenX){
  // All geometry is drawn in slope-local coordinates, so it rests perpendicular to the snow.
  const gy=snowGround(x), angle=snowNormal(x);
  ctx.save();ctx.translate(screenX,gy);ctx.rotate(angle);
  // Rounded snowdrift rather than a floating rectangular obstacle.
  ctx.fillStyle='#a9d7eb';ctx.beginPath();ctx.moveTo(-14,0);
  ctx.quadraticCurveTo(-12,-12,-7,-15);ctx.quadraticCurveTo(-2,-23,4,-17);
  ctx.quadraticCurveTo(12,-15,14,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f7fcff';ctx.beginPath();ctx.moveTo(-13,-5);
  ctx.quadraticCurveTo(-9,-16,-3,-14);ctx.quadraticCurveTo(3,-24,8,-13);
  ctx.quadraticCurveTo(13,-9,13,-5);ctx.closePath();ctx.fill();
  ctx.restore();
 }
function updateSnow(dt){
 if(!snow)return;
 const s=snow,k=Math.min(.04,dt/1000),ground=snowGround(s.distance);
 if(jumpQueue){if(s.onGround){s.airVy=-300;s.onGround=false;s.airY=ground-4}jumpQueue=false}
 if(!s.onGround){s.airVy+=720*k;s.airY+=s.airVy*k;if(s.airY>=snowGround(s.distance)){s.airY=snowGround(s.distance);s.onGround=true;s.airVy=0;for(let i=0;i<9;i++)s.particles.push({x:s.distance,y:s.airY,vx:-35-Math.random()*65,vy:-20-Math.random()*55,life:.5})}}
 // Downhill speeds up, uphill slows down. Keep a forgiving minimum speed.
 const slope=snowSlope(s.distance);s.speed=Math.max(105,Math.min(195,s.speed+slope*105*k));
 const before=s.distance;s.distance+=s.speed*k;
 if(s.onGround)s.airY=snowGround(s.distance);
 s.angle=Math.atan(snowSlope(s.distance));
 const feet=s.onGround?snowGround(s.distance):s.airY;
 for(let i=0;i<SNOW_FLAKES.length;i++){const x=SNOW_FLAKES[i];if(!s.flakes.has(i)&&Math.abs(s.distance-x)<17&&Math.abs(feet-(snowGround(x)-45))<40)s.flakes.add(i)}
 for(const x of SNOW_OBSTACLES){if(before<x+12&&s.distance>=x-12&&s.distance<x+16&&feet>snowGround(x)-24){snowFail();return}}
 if(s.onGround&&Math.random()<.8)s.particles.push({x:s.distance-14,y:feet,vx:-35-Math.random()*55,vy:-15-Math.random()*20,life:.4});
 for(const q of s.particles){q.x+=q.vx*k;q.y+=q.vy*k;q.vy+=90*k;q.life-=k}s.particles=s.particles.filter(q=>q.life>0).slice(-90);
 if(s.distance>=SNOW_FINISH_X){snowFinish();return}
}

  ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='#f4fbff';ctx.fill();

  for(const [depth,color,width] of [[0,'#9fd8ef',4],[9,'#d7edf9',2]]){
   ctx.beginPath();for(let x=0;x<=W+3;x+=3){const y=snowGround(offset+x)+depth;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
   ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
  }ctx.lineWidth=1;
  // Sparse texture placed along the normal rather than in a flat screen-space row.
  for(let x=10;x<W;x+=35){const wx=offset+x,y=snowGround(wx),a=snowNormal(wx);
   ctx.save();ctx.translate(x,y);ctx.rotate(a);rect(-4,18,9,1,'#dbeff8');ctx.restore();
  }
  for(const x of SNOW_OBSTACLES){const sx=x-offset;if(sx>-40&&sx<W+40)snowObstacle(x,sx)}
for(let i=0;i<SNOW_FLAKES.length;i++){const x=SNOW_FLAKES[i],sx=x-offset;if(sx>-25&&sx<W+25&&!s.flakes.has(i))text('❄',sx,snowGround(x)-45,'#fff',20,'center')}
 for(const q of s.particles){ctx.globalAlpha=Math.max(0,q.life/.5);circle(q.x-offset,q.y,2,'#fff');ctx.globalAlpha=1}

 // The lion is anchored to the summit in world coordinates and appears as soon as it enters view.

 text('❄ 未来的冬天',18,29,'#426b88',20);text('🏂 跳过雪堆 · ❄ '+s.flakes.size+'/'+SNOW_FLAKES.length,18,53,'#426b88',12);
 rect(18,65,W-36,7,'#ffffff88');rect(18,65,(W-36)*Math.min(1,s.distance/(SNOW_SPEED*SNOW_LENGTH)),7,'#ed9fc8');if(scene&&scene.type==='snowEnding'){

 }else text('✦ 跳跃',W-28,H-22,'#6d8ba4',13,'right');
}

function artSprite314(which,x,y,face,sit){
 const im=ART314[which],cw=which==='bunny'?32:40,ch=40;
 if(!im.complete||!im.naturalWidth)return false;
 let col=sit&&level===1&&scene&&['sunset','fireworks'].includes(scene.type)?2:(face<0?1:3);
 let row=0;
 if(!sit&&mode==='play'&&which==='bunny'&&Math.abs(p.vx)>.5){
   col=4+Math.floor(timer/115)%4;row=face<0?2:1;
 }
 if(!sit&&mode==='play'&&which==='lion'&&Math.abs(lion.x-(p.x-38))>8){
   col=4+Math.floor(timer/135)%4;row=face<0?2:1;
 }
 ctx.drawImage(im,col*cw,row*ch,cw,ch,Math.round(x+(which==='bunny'?-5:-8)),Math.round(y-13),cw,ch);
 return true;
}
const originalBunny314=bunny,originalLion314=lionDraw;
bunny=function(x,y,face,sit,dead){if(dead||!artSprite314('bunny',x,y,face,sit))originalBunny314(x,y,face,sit,dead)};
lionDraw=function(x,y,face,sit){if(!artSprite314('lion',x,y,face,sit))originalLion314(x,y,face,sit)};

function bubble(x,y,t){ctx.font='bold 11px sans-serif';const w=ctx.measureText(t).width+14;rect(x-w/2,y-22,w,20,'#fff');rect(x-3,y-3,6,4,'#fff');text(t,x,y-8,'#7b4d6e',11,'center')}
function heart(x,y){circle(x-5,y-2,6,'#f26d9e');circle(x+5,y-2,6,'#f26d9e');ctx.fillStyle='#f26d9e';ctx.beginPath();ctx.moveTo(x-11,y);ctx.lineTo(x,y+12);ctx.lineTo(x+11,y);ctx.fill()}
function seedDraw(x,y){const b=Math.sin(timer/300)*2;circle(x,y+b,11,'#fff6b0');circle(x,y+b,7,'#a5d66f');rect(x-1,y-10+b,2,6,'#5fae6a');circle(x+4,y-10+b,3,'#8bd06b')}
function cloudDraw(c){
 const progress=c.building?Math.min(1,c.t/1300):1;
 const x=c.x-cam,y=G-6+(1-progress)*33;
 ctx.save();ctx.globalAlpha=.97*progress;
 const wholeWidth=c.w;c={...c,w:Math.max(1,wholeWidth*progress)};
 rect(x,y,c.w,10,'#f6faff');rect(x+4,y+10,c.w-8,4,'#a7dce6');
 for(let i=0;i<Math.max(2,Math.ceil(c.w/34));i++){
  const xx=x+10+(c.w-20)*i/Math.max(1,Math.ceil(c.w/34)-1);
  circle(xx,y-3-(i%2)*4,14,'#fff');circle(xx+11,y+1,10,'#e3faff');
 }
 for(let i=0;i<7;i++){const xx=x+(i+.5)*c.w/7;circle(xx,y-21+Math.sin(timer/310+i)*3,2,'#fff2bb')}
 ctx.restore();
}

// V3.0.2 — spring diving, summer cave, redwood autumn, winter cabin, seed pickups and cooperative watering.
function drawFourSeasons(){
 // One continuous forest-to-garden palette; no hard seasonal panels.
 const sky=ctx.createLinearGradient(0,0,0,G);sky.addColorStop(0,'#c7e4db');sky.addColorStop(.7,'#dff0cf');sky.addColorStop(1,'#b7d8b9');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,G);

// ================= Gate (welcome + anniversary date) =================
function parseDate(v){const d=(v||'').replace(/[^0-9]/g,'');if(d.length===4)return d==='0718';if(d.length===8)return d.slice(4)==='0718';return false}
let wrong=0;
function showGate(step){mode='gate';showUI(false);$('#shade').classList.add('hide');$('#gate').classList.remove('hide');$('#gate-welcome').classList.toggle('hide',step!=='welcome');$('#gate-date').classList.toggle('hide',step!=='date');if(step==='date'){$('#gate-msg').textContent='';setTimeout(()=>{try{$('#gate-input').focus()}catch(e){}},50)}}
function passGate(){try{localStorage.setItem(GATE,'1')}catch(e){}$('#gate-input').blur();$('#gate').classList.add('hide');mode='menu';home()}
$('#gate-enter').addEventListener('click',()=>gateOk()?passGate():showGate('date'));
// V3.1.5: native click remains primary for accessibility and iOS Safari.

$('#gate-date').addEventListener('submit',e=>{e.preventDefault();const v=$('#gate-input').value;
 if(parseDate(v)){$('#gate-msg').textContent='答对啦 ♡';setTimeout(passGate,350)}
 else{wrong++;$('#gate-msg').textContent=wrong>=3?'提示：是 7 月的某一天，输入 4 位数字，比如 0101':'再想想～是我们在一起的那一天哦';const c=$('#gate-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}});
$('#gate-input').addEventListener('input',e=>{const t=e.target;t.value=t.value.replace(/[^0-9]/g,'').slice(0,8)});

// ================= Input =================
['left','right','jump'].forEach(key=>{let el=$('#'+key);function down(e){e.preventDefault();if(mode!=='play'&&mode!=='dive'&&!(mode==='scene'&&scene&&scene.type==='snow'&&key==='jump'))return;try{el.setPointerCapture(e.pointerId)}catch(_){}held[key]=true;el.classList.add('pressed');if(key==='jump')jumpQueue=true}function up(e){e.preventDefault();held[key]=false;el.classList.remove('pressed')}el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)});
// Pause / interact react on touch-down so they work even while another finger holds a direction key
$('#pause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(mode==='dive')pauseDive();else pause()});
$('#interact').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();interact()});
window.addEventListener('keydown',e=>{if(mode==='gate')return;if(['ArrowLeft','ArrowRight','Space','ArrowUp','Escape','KeyE'].includes(e.code))e.preventDefault();if(e.code==='Escape'){if(mode==='play')pause();else if(mode==='dive')pauseDive();return}if(mode!=='play'&&mode!=='dive'&&!(mode==='scene'&&scene&&scene.type==='snow'))return;if(e.code==='KeyE'){interact();return}if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if((e.code==='Space'||e.code==='ArrowUp')&&!held.jump){held.jump=true;jumpQueue=true}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false;if(e.code==='Space'||e.code==='ArrowUp')held.jump=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='play')pause();else if(mode==='dive')pauseDive()}});
window.addEventListener('blur',()=>{if(mode==='play')pause();else if(mode==='dive')pauseDive()});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,#card'))e.preventDefault()});
document.addEventListener('selectionchange',()=>{if((mode==='play'||mode==='dive')&&window.getSelection)window.getSelection().removeAllRanges()});
// block page scrolling, except inside the text card (long text can scroll)
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#card'))return;if(e.cancelable)e.preventDefault()},{passive:false});

 W=Math.max(560,Math.min(1000,Math.round(360*vw/vh)));if(canvas.width!==W){canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false}if(L)cam=Math.max(0,Math.min(L.end-W,cam))}

load();layout(Math.min(2,data.level));respawnAt(L.cps[data.cpLevel===level?Math.min(L.cps.length-1,data.cp):0]);size();setTimeout(size,500);
