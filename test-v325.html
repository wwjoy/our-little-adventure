let sitReviewEnabled=false;
const sitButton=document.getElementById('sit-review');
sitButton.addEventListener('click',()=>{sitReviewEnabled=!sitReviewEnabled;sitButton.textContent='安全站姿：'+(sitReviewEnabled?'开':'关');sitButton.classList.toggle('active',sitReviewEnabled)});

let lastLionReviewX=null,lastLionReviewAt=0;
let lionOnMovingRaftIdle=false; // Only animation override; raft physics remain unchanged.

function drawReviewSprite(kind,x,y,sit,face){
 if(backReviewEnabled&&!sitReviewEnabled){const im=backReviewImages[kind];if(im&&im.complete&&im.naturalWidth){const w=kind==='BUNNY_URL'?32:40;ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(im,Math.round(x+(kind==='BUNNY_URL'?-5:-8)),Math.round(y+27-40+(sit?3:0)),w,40);ctx.restore();return true;}}
 const movingDir=face<0?'LEFT':'RIGHT';
 const key=kind==='BUNNY_URL'?'BUNNY_'+movingDir:'LION_'+movingDir;
 const im=reviewSprites[key]; if(!im||!im.complete||!im.naturalWidth)return false;
 const w=kind==='BUNNY_URL'?32:40,h=40;
 // Existing 22x27 collision boxes and all movement physics are unchanged.
 const dx=Math.round(x+(kind==='BUNNY_URL'?-5:-8));
 const dy=Math.round(y+27-h+(sit?3:0));
 let moving=false;
 if(kind==='BUNNY_URL')moving=Math.abs(p.vx)>0.35 && p.on && !sit;
 else {const now=performance.now();if(lastLionReviewX!==null&&Math.abs(x-lastLionReviewX)>0.06)lastLionMotionUntil=now+180;moving=!lionOnMovingRaftIdle && now<lastLionMotionUntil;lastLionReviewX=x;lastLionReviewAt=now;}
 const prefix=(kind==='BUNNY_URL'?'bunny_':'lion_')+movingDir.toLowerCase()+'_'+(moving?'run':'idle')+'_';
 const index=moving?Math.floor(timer/115)%4:Math.floor(timer/460)%3;
 const airborne=kind==='BUNNY_URL'?(!p.on&&Math.abs(p.vy)>0.15):(!p.on&&Math.abs(p.x-lion.x)<85&&Math.abs(p.y-lion.y)<95);
 let jumpImage=null;
 if(airborne){
  const v=p.vy;
  const phase=v < -4?0:v < -0.7?1:v < 2?2:3;
  jumpImage=jumpFrames[(kind==='BUNNY_URL'?'bunny_':'lion_')+movingDir.toLowerCase()+'_jump_'+phase];
 }
 // V3.2.5 safety fix: rejected sit frames contain detached lower bodies.
 // Never use those frames for the playable character, including during cutscenes.
 // Keep the approved intact sprite and limit the seated pose to the separate sunset review.
 const animated=(sit||mode==='scene'||sitReviewEnabled)?motionFrames[(kind==='BUNNY_URL'?'bunny_':'lion_')+movingDir.toLowerCase()+'_idle_0']:(jumpImage||motionFrames[prefix+index]);

// V3.2.5 scene-specific outfit routing. All other scenes retain approved daily sprites.
// FIX: approved daily sprite renderer is now used in levels 1, 2, and 3, including cutscenes; cave, snow, dive override it.
const outfitSprites={};
for(const [key,uri] of Object.entries(OUTFIT_DATA)){const img=new Image();img.src=uri;outfitSprites[key]=img;}
let outfitRenderMode='daily';
function drawSceneOutfit(kind,x,y,face,sit){
 let mode=outfitRenderMode;
 if(mode==='daily' && level===2 && L && L.under)mode='cave';
 if(mode==='daily')return false;
 const animal=kind==='bunny'?'bunny':'lion';
 const dir=face<0?'left':'right';
 const img=outfitSprites[animal+'_'+mode+'_'+dir];
 if(!img||!img.complete||!img.naturalWidth)return false;
 ctx.save();ctx.imageSmoothingEnabled=false;
 ctx.drawImage(img,Math.round(x+(animal==='bunny'?-5:-8)),Math.round(y+27-40+(sit?3:0)),animal==='bunny'?32:40,40);

const boarImages={};
for(const [name,url] of Object.entries(BOAR_ASSET_DATA)){const im=new Image();im.src=url;boarImages[name]=im;}
function firstLevelBoar(e){return level===0&&!L.secret&&!L.under&&e.type==='walker'}
function boarFrameName(e){
 if(e.dead){if(e.dead<145)return 'hit_0';if(e.dead<340)return 'hit_1';return 'hit_2'}
 if(e.turnT>0)return 'turn_'+(Math.floor((e.animT||0)/100)%2);
 const moving=Math.abs(e.v||0)>0.01&&!sleeping;
 if(!moving)return 'idle_'+(Math.floor((e.animT||0)/220)%3);
 const dir=(e.dir||Math.sign(e.v)||1)<0?'left':'right';
 return dir+'_'+(Math.floor((e.animT||0)/120)%4);
}
function drawFirstLevelBoar(e,x,floorY){
 const key=boarFrameName(e),im=boarImages[key];if(!im||!im.complete||!im.naturalWidth)return false;
 const w=38,h=28,by=floorY-(e.hop||0); // V3.2.5: visual size reduced ~9%; gameplay collision unchanged
 ctx.save();ctx.imageSmoothingEnabled=false;
 if(e.dead&&e.dead>340)ctx.globalAlpha=Math.max(0,1-(e.dead-340)/240);
 ctx.drawImage(im,Math.round(x-w/2),Math.round(by-h),w,h);
 ctx.restore();return true;
}

function themedMonsterKind(e){return secondLevelCrab(e)?'crab':thirdLevelBud(e)?'bud':null}
function themedMonsterFrameName(e){
 if(e.dead){if(e.dead<145)return 'hit_0';if(e.dead<340)return 'hit_1';return 'hit_2'}
 if(e.turnT>0)return 'turn_'+(Math.floor((e.animT||0)/100)%2);
 const moving=Math.abs(e.v||0)>0.01&&!sleeping;
 if(!moving)return 'idle_'+(Math.floor((e.animT||0)/220)%3);
 const dir=(e.dir||Math.sign(e.v)||1)<0?'left':'right';
 return dir+'_'+(Math.floor((e.animT||0)/120)%4);
}
function drawThemedGroundEnemy(e,x,floorY){
 const kind=themedMonsterKind(e);if(!kind)return false;
 const key=themedMonsterFrameName(e),im=otherMonsterImages[kind][key];if(!im||!im.complete||!im.naturalWidth)return false;
 const w=kind==='crab'?34:32,h=kind==='crab'?25:27,by=floorY-(e.hop||0);
 ctx.save();ctx.imageSmoothingEnabled=false;
 if(e.dead&&e.dead>340)ctx.globalAlpha=Math.max(0,1-(e.dead-340)/240);
 ctx.drawImage(im,Math.round(x-w/2),Math.round(by-h),w,h);
 ctx.restore();return true;
}

function checkpoint(i){

 // Only the movement system can confirm a flag: crossing it, then landing safely.

  data.cp=i;data.cpLevel=level;save();

 }

}
function updateFlags(prevX){
 if(L.under)return;
 const previous=data.cpLevel===level?data.cp:0;
 // Crossing the flag with the bunny's center, even high above the flag, arms it.
 // No flag may be armed just because a respawn placed the bunny nearby.
 const before=prevX+p.w/2,now=p.x+p.w/2;
 if(now>before){
  for(let i=previous+1;i<L.cps.length;i++){
   const fx=L.cps[i];
   if(before<fx&&now>=fx)pendingFlag=Math.max(pendingFlag,i);
  }
 }
 // The player must land safely after crossing. Falling into a pit cancels it.
 if(pendingFlag>previous&&p.on&&onFloor(p.x)&&p.y+p.h<=G+2){
  checkpoint(pendingFlag);
 }
}

 const tiers=variant===0?3:variant===1?4:2;
 for(let k=0;k<tiers;k++){const yy=y-h+(k*h*(variant===1?.19:.26)),w=h*(.16+k*.045+(variant===2?.025:0));
 ctx.beginPath();ctx.moveTo(Math.round(x),Math.round(yy));ctx.lineTo(Math.round(x-w),Math.round(yy+h*.33));ctx.lineTo(Math.round(x+w),Math.round(yy+h*.33));ctx.closePath();ctx.fill();}

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function text(t,x,y,c,size,align){ctx.fillStyle=c;ctx.font='bold '+(size||11)+'px sans-serif';ctx.textAlign=align||'left';ctx.fillText(t,x,y);ctx.textAlign='left'}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t),g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t),bl=Math.round((pa&255)*(1-t)+(pb&255)*t);return 'rgb('+r+','+g+','+bl+')'}
function mix3(a,b,c,t){return t<.5?mix(a,b,t*2):mix(b,c,(t-.5)*2)}

function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}

function v325BackdropScroll(im, shift, top){
 if(!im||!im.complete||!im.naturalWidth)return false;
 const tile=im.naturalWidth;
 const offset=((cam*shift)%tile+tile)%tile;
 ctx.save();ctx.imageSmoothingEnabled=false;
 // Screen-space copies, safely cover the 560-1000px responsive canvas width.
 for(let x=-offset;x<W;x+=tile)ctx.drawImage(im,Math.round(x),top);
 ctx.restore();return true;
}
function firstLevelSky(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#83bdfa');sky.addColorStop(.31,'#a9d1fa');
 sky.addColorStop(.68,'#e4ccec');sky.addColorStop(1,'#ffe4cf');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // Warm, subdued sunlight does not compete with HUD and collection targets.
 const sx=W*.81-cam*.017,sy=56;
 ctx.save();
 const halo=ctx.createRadialGradient(sx,sy,10,sx,sy,58);
 halo.addColorStop(0,'rgba(255,242,185,.29)');
 halo.addColorStop(1,'rgba(255,244,194,0)');
 ctx.fillStyle=halo;ctx.fillRect(sx-60,sy-60,120,120);
 circle(sx,sy,24,'#fff0b9');circle(sx-8,sy-8,6,'#fff9da');
 ctx.restore();
 v325BackdropScroll(v325TownBackdrops.clouds,.065,12);
 // Three independent parallax strips use repeating authored images, so the
 // mountains and forest cannot abruptly disappear as the camera scrolls.
 v325BackdropScroll(v325TownBackdrops.farMountains,.115,42);
 v325BackdropScroll(v325TownBackdrops.midMountains,.185,91);
 // One castle, softly placed in the far distance rather than tiled.
 const cx=W*.79+196-cam*.18;
 const castle=v325TownBackdrops.castle;
 if(castle.complete&&castle.naturalWidth&&cx>-170&&cx<W+170){
   ctx.save();ctx.imageSmoothingEnabled=false;
   ctx.globalAlpha=.85;ctx.drawImage(castle,Math.round(cx-65),107,130,107);
   ctx.restore();
 }
 v325BackdropScroll(v325TownBackdrops.woodland,.28,200);
 // Existing gentle floating petals retained, no gameplay interactions.
 for(let i=0;i<32;i++){
  const xx=((i*103+timer*.008-cam*.06)%(W+30)+W+30)%(W+30)-15;
  const yy=58+(i*43)%148;
  rect(xx,yy,i%4===0?3:2,2,i%3?'#ffe0ef':'#fffaf5');
 }
}

function firstLevelHouse(wx,w,h,body,roof,awning){
 // All town cottages retain their approved ordinary low-ground baseline.
 // Decorative fence positions do not affect this anchor.
 const visualLift=0;
 const x=Math.round(wx-cam),base=G+1-visualLift;
 const drawW=w+20,drawH=h+30,drawX=x-10,drawY=base-drawH;
 if(drawX>W+25||drawX+drawW<-25)return;
 const choice=wx===185?0:wx===525||wx===1235?1:2;
 const house=v325TownHouseArt[choice];
 if(house.complete&&house.naturalWidth===136){
  ctx.save();ctx.imageSmoothingEnabled=false;
  ctx.drawImage(house,drawX,drawY,drawW,drawH);
  ctx.restore();
 }else{
  // Decoding fallback is ephemeral; decorative only, unchanged world positions.
  rect(x+8,base-h+8,w-16,h-8,body);
  poly([[x-8,base-h+12],[x+w/2,base-h-27],[x+w+8,base-h+12]],roof);
 }
}

function firstLevelFence(wx,len,y){
 // Fence design and tile unchanged; two short first-yard segments flank pink cottage.
 // avoids stretched posts and aligns the feet of the pickets to the former ground level.
 const x=Math.round(wx-cam);if(x>W||x+len<0)return;
 const yy=Math.round(y-26);
 // Local fence visibility windows: leave the approved wooden benches visible.
 // Wooden bench masking remains unchanged; approved fence texture is untouched.
 const gaps=[[545,635],[1198,1288]];
 ctx.save();ctx.beginPath();
 let cursor=wx;
 for(const [g0,g1] of gaps){
   if(g1<=cursor||g0>=wx+len)continue;
   const stop=Math.min(wx+len,Math.max(cursor,g0));
   if(stop>cursor)ctx.rect(Math.round(cursor-cam),yy,stop-cursor,33);
   cursor=Math.max(cursor,Math.min(wx+len,g1));
 }
 if(wx+len>cursor)ctx.rect(Math.round(cursor-cam),yy,wx+len-cursor,33);
 ctx.clip();
 if(firstLevelFenceTile.complete&&firstLevelFenceTile.naturalWidth===48){

     ctx.drawImage(firstLevelFenceTile,0,0,segment,33,x+i,yy,segment,33);

function firstLevelCherryTree(wx){
 const x=Math.round(wx-cam);
 if(x<-86||x>W+86)return;
 const index=((Math.floor(wx/71)%3)+3)%3, im=v325CherryTrees[index];
 if(im.complete&&im.naturalWidth===160){
   ctx.save();ctx.imageSmoothingEnabled=false;
   ctx.drawImage(im,x-80,Math.round(G+2-176),160,176);
   ctx.restore();
 } else {
   // Temporary decoding fallback. The old tree is not invoked once image decode completes.
   rect(x-6,G-88,12,90,'#966579');
   circle(x-27,G-116,26,'#f0a2c8');circle(x+14,G-124,31,'#ffd1e4');
   circle(x+29,G-102,23,'#f6afd4');
 }
}

function updateDive(dt){
 if(!dive)return;const d=dive,k=Math.min(2,dt/16.667);d.t+=dt;
 const direction=(held.right?1:0)-(held.left?1:0);
 d.vx=direction*2.65;d.x=Math.max(22,Math.min(DIVE_WORLD-35,d.x+d.vx*k));
 const inStream=d.x>846&&d.x<967;
 // A timed current gives an optional lift. Normal swim is still possible but slower.
 d.updraft=inStream&&Math.sin(d.t/950)>-.32;
 if(d.updraft){d.vy=Math.max(-3.8,d.vy-.55*k);if(d.t-d.updraftFlash>2400){d.updraftFlash=d.t;flash('🫧 泡泡升流把你托起来啦！')}}
 else if(held.jump||jumpQueue){d.vy=Math.max(-2.65,d.vy-.30*k)}
 else d.vy=Math.min(1.25,d.vy+.105*k);
 d.y=Math.max(62,Math.min(253,d.y+d.vy*k));if(d.y===62||d.y===253)d.vy=0;
 d.lionX+=(d.x-36-d.lionX)*.095*k;d.lionY+=(d.y+6-d.lionY)*.075*k;
 d.view+=(Math.max(0,Math.min(DIVE_WORLD-W,d.x-W*.35))-d.view)*.09*k;
 const n=data.dive.pieces.length;
 const nearby=n===0?Math.abs(d.x-355)<72&&d.y>155:n===1?Math.abs(d.x-1040)<82:n===2?Math.abs(d.x-1810)<80&&d.y>155:true;
 $('#interact').classList.toggle('hide',!nearby&&n<3);
 $('#interact').textContent=n===0?'🐚 打开贝壳':n===1?'🫧 取高处碎片':n===2?'🎁 打开宝箱':'🗺️ 藏宝图';
 $('#hud').textContent='🌊 深蓝色的秘密　🗺️ '+n+'/3';
 jumpQueue=false;
}

  }

const DIVE_SWIM_IMG={};
Object.keys(DIVE_SWIM_DATA).forEach(key=>{const img=new Image();img.src=DIVE_SWIM_DATA[key];DIVE_SWIM_IMG[key]=img});
function drawHorizontalDiveSprite(animal,worldX,worldY,face,time){
 const side=face<0?'left':'right';
 const frame=Math.floor(time/155)%4;
 const img=DIVE_SWIM_IMG[animal+'_dive_swim_'+side+'_'+frame];
 if(img&&img.complete&&img.naturalWidth){
   const sx=Math.round(worldX-dive.view-17);
   const sy=Math.round(worldY-9+Math.sin(time/240+(animal==='lion'?0.65:0))*1.2);
   ctx.save();ctx.imageSmoothingEnabled=false;
   ctx.drawImage(img,sx,sy,60,46);ctx.restore();
   return;
 }
 // A missing frame must never show an upright/front-facing pose.
}

function drawDive(){
 if(!dive)return;const d=dive,v=d.view;
 let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#77dfe9');bg.addColorStop(.3,'#278cb3');bg.addColorStop(1,'#092a56');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // Three regions share one continuous gradient and camera, but have distinct silhouettes.
 for(let i=0;i<15;i++){const x=i*175-v*.17;ctx.globalAlpha=.11;ctx.fillStyle='#f5ffff';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+28,0);ctx.lineTo(x+126,300);ctx.lineTo(x+46,300);ctx.fill();ctx.globalAlpha=1}
 for(let i=0;i<80;i++){const wx=(i*79+20)%DIVE_WORLD,sy=28+((i*41+d.t*.020)%260);circle(wx-v,sy,1+i%3,'#b8f6f8bb')}
 // Sloping ocean floor and a dark canyon, no more featureless full-width strip.
 ctx.fillStyle='#d4c59c';ctx.beginPath();ctx.moveTo(0,300);for(let x=0;x<=W+12;x+=12){const world=x+v;let y=288+5*Math.sin(world/75);if(world>=670&&world<795){const s=(world-670)/125;y+=(H+80-y)*(s*s*(3-2*s))}else if(world>=795&&world<=1130)y=H+80;else if(world>1130&&world<=1280){const s=(1280-world)/150;y+=(H+80-y)*(s*s*(3-2*s))}ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 // Canyon left and right faces, far underwater mountains.
 for(let i=0;i<18;i++){const wx=i*145-v*.42,base=290;ctx.fillStyle=i%2?'#20547755':'#2a6f8155';ctx.beginPath();ctx.moveTo(wx-110,base);ctx.lineTo(wx,165+(i%3)*19);ctx.lineTo(wx+130,base);ctx.fill()}
 for(let i=0;i<26;i++){let wx=i*88+12;let sx=wx-v;if(sx<-80||sx>W+80||wx>770&&wx<1220)continue;rect(sx,266,6,24,'#369a88');rect(sx+9,257,5,32,'#58b9a5');if(i%2===0)diveCoral(sx+12,281,.63,i)}
 for(let i=0;i<19;i++){let fx=i*123+Math.sin(d.t/1550+i)*22-v*.82,fy=93+(i*53)%158;if(fx<-28||fx>W+28)continue;rect(fx-5,fy-3,10,6,i%2?'#ffe2a8':'#ffb2d4');rect(fx+1,fy-2,2,2,'#5a6388');ctx.fillStyle=i%2?'#ffe2a8':'#ffb2d4';ctx.beginPath();ctx.moveTo(fx-4,fy);ctx.lineTo(fx-11,fy-5);ctx.lineTo(fx-11,fy+5);ctx.fill()}
 // Distant pixel seaweed and tiny pearl-like seabed accents; cosmetic only.
 for(let i=0;i<30;i++){const wx=i*73+29,sx=wx-v;if(sx<-20||sx>W+20||wx>760&&wx<1290)continue;const yy=280+4*Math.sin(wx/75);rect(sx,yy-5,3,5,i%3?'#80c9b6':'#b3e3cf');if(i%4===0){circle(sx+8,yy-3,2,'#f9d9cb');circle(sx+13,yy-1,1.5,'#fff2d9')}}
 // Small decorative shells and sand lines on the existing sea floor.
 for(let i=0;i<46;i++){
  const wx=33+i*49;if((wx>=665&&wx<=1290))continue;
  diveSeabedDetail(wx,v,287+5*Math.sin(wx/75),i);
 }
 // First stop: three tiers of natural reef and a luminous shell.
 for(const [x,y,w,h] of [[180,283,190,61],[337,283,225,94],[465,283,115,47]]){if(x-v<W+140&&x-v>-210)diveRock(x-v,y,w,h)}
 for(const x of [210,266,333,438,490])if(x-v>-45&&x-v<W+45)diveCoral(x-v,225+(x%3)*13,.77,Math.floor(x/60));
 let sx=355-v;if(sx>-120&&sx<W+120){circle(sx,218,29,'#e892bb');circle(sx,223,23,'#ffd2e4');circle(sx,226,17,'#fff3e0');text('珊瑚浅海',sx,168,'#fff6de',15,'center');if(!data.dive.pieces.includes(0))text('🗺️',sx,213,'#fff',20,'center')}
 // Second stop: vertical gorge and timed bubble updraft, reward at the TOP.
 // Layered rock shelves and coral bind the updraft visually to the surrounding seafloor.
 for(const [x,y,w,h] of [[700,320,128,98],[786,320,117,150],[1090,320,139,142],[1175,320,90,88],[780,191,86,48],[972,115,180,47]]){let vx=x-v;if(vx>-220&&vx<W+220)diveRock(vx,y,w,h)}
 // Broken coral shelves, sea anemones and tiny bioluminescent marks guide the eye upward.
 for(const [x,y,s] of [[714,267,.7],[784,176,.55],[844,222,.42],[1100,176,.62],[1208,263,.72],[1009,105,.45]]){
  const dx=x-v;if(dx>-70&&dx<W+70)diveCoral(dx,y,s,Math.floor(x/90));
 }
 for(const [x,y] of [[765,255],[820,157],[989,115],[1112,240],[1176,287]]){
  const dx=x-v;if(dx>-30&&dx<W+30){circle(dx,y,3.5,'#bff8f3');circle(dx+9,y-5,2.5,'#b7e3fc')}
 }
 sx=908-v;if(sx>-160&&sx<W+160){
  const strong=d.updraft;
  // A luminous vent anchors the rising bubbles; the stream is softly feathered rather than boxed in.
  const flow=ctx.createRadialGradient(sx,260,10,sx,175,155);
  flow.addColorStop(0,strong?'#7bf6e54b':'#64d5d52f');flow.addColorStop(.7,'#5ad9e31a');flow.addColorStop(1,'#5ad9e300');
  ctx.fillStyle=flow;ctx.fillRect(sx-155,28,310,270);
  ctx.fillStyle='#335f86';ctx.beginPath();ctx.ellipse(sx,285,45,13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#77d9d6';ctx.beginPath();ctx.ellipse(sx,283,29,6,0,0,Math.PI*2);ctx.fill();
  for(let i=0;i<35;i++){let bx=sx+Math.sin(i*8.7+d.t/1100)*39,by=278-((i*37+d.t*(strong?.14:.065))%254);circle(bx,by,2.3+i%4,strong?'#c7fdffcc':'#79dcea99')}
  for(let i=0;i<10;i++){let bx=sx-47+i*10,by=255+Math.sin(d.t/300+i)*4;circle(bx,by,1.5,'#d5fff2aa')}
  text('🫧 升流峡谷',sx,79,'#fff6de',14,'center');text('▲ 跟着泡泡向上游',sx,99,'#f7f8dd',10,'center');
 }
 sx=1040-v;if(sx>-100&&sx<W+100){circle(sx,81,28,'#a7e8f0aa');circle(sx,81,19,'#ffe5f1');text('🐚',sx,88,'#fff',28,'center');if(!data.dive.pieces.includes(1))text('🗺️',sx,67,'#fff',15,'center');text('高处藏宝贝壳',sx,121,'#fff7dd',12,'center')}
 // Third stop: a storybook moonlight shipwreck, same world anchor and treasure trigger.
 sx=1810-v;if(sx>-270&&sx<W+270){
  ctx.save();ctx.translate(sx,222);ctx.rotate(-.08);
  // Curved timber hull, old golden trim, and a gently broken bow.
  ctx.fillStyle='#4f4555';ctx.beginPath();ctx.moveTo(-196,14);ctx.lineTo(178,14);ctx.lineTo(147,64);ctx.lineTo(102,79);ctx.lineTo(-132,79);ctx.lineTo(-175,54);ctx.closePath();ctx.fill();
  ctx.fillStyle='#86645e';ctx.beginPath();ctx.moveTo(-190,11);ctx.lineTo(171,11);ctx.lineTo(133,62);ctx.lineTo(100,70);ctx.lineTo(-130,70);ctx.lineTo(-164,49);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#d6a57a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-187,13);ctx.quadraticCurveTo(-10,25,174,13);ctx.stroke();
  rect(-113,-29,199,43,'#9e7969');rect(-115,-32,205,5,'#e4b18c');
  // Cabin and a tattered cream sail.
  rect(-45,-91,7,63,'#785d62');rect(-42,-90,4,54,'#c79e82');
  ctx.fillStyle='#f5dfc2';ctx.beginPath();ctx.moveTo(-35,-83);ctx.lineTo(63,-81);ctx.lineTo(60,-64);ctx.lineTo(42,-63);ctx.lineTo(29,-51);ctx.lineTo(-33,-54);ctx.closePath();ctx.fill();
  rect(-34,-83,94,3,'#fff0d6');rect(-119,-39,251,7,'#bd8c78');
  for(let j=0;j<7;j++){rect(-139+j*40,34+(j%2)*4,26,3,'#b98a75');rect(-129+j*40,46,15,2,'#d5a789')}
  for(const xx of [-89,-24,42,103]){circle(xx,22,13,'#3e5065');circle(xx,22,9,'#d5b68b');circle(xx,22,6,'#9fe1e3');circle(xx-2,20,2,'#e9ffff')}
  // Seaweed and barnacles make the vessel feel long submerged.
  for(const xx of [-165,-130,123,155]){rect(xx,65,4,12,'#5caa9d');rect(xx+5,69,3,8,'#a4d9b6');circle(xx+2,61,3,'#cce7d4')}
  ctx.restore();
  circle(sx,225,34,'#ffdd9930');
  text('月光沉船',sx,97,'#fff8df',16,'center');
  rect(sx-22,230,46,28,'#e6b579');rect(sx-22,229,46,7,'#c784a0');text('🎀',sx,229,'#fff',18,'center');if(!data.dive.pieces.includes(2))text('🗺️',sx,219,'#fff',19,'center');
  for(const xx of [sx-180,sx+170])diveCoral(xx,273,.92,xx<sx?1:2);
 }
 // Only the next objective is marked. y indicates vertical gameplay for the second stop.
 let n=data.dive.pieces.length;if(n<3){const gx=DIVE_STOPS[n]-v,gy=n===1?75:178;if(gx>-40&&gx<W+40){circle(gx,gy+Math.sin(d.t/290)*4,5,'#fff2b1');text('✧',gx,gy-12,'#fff9e5',19,'center')}}
 // Dedicated swim sprites: side-facing, prone body and alternating kicks.
 // Follow the travel direction; upward movement retains the last horizontal direction.
 if(d.vx<-0.1)d.swimFacing=-1;
 else if(d.vx>0.1)d.swimFacing=1;
 if(!d.swimFacing)d.swimFacing=1;
 drawHorizontalDiveSprite('lion',d.lionX,d.lionY,d.swimFacing,d.t+90);
 drawHorizontalDiveSprite('bunny',d.x,d.y,d.swimFacing,d.t);

 // Keep the top HUD clear. Instructions sit in a small lower-right guide panel.
 ctx.save();ctx.globalAlpha=.88;rect(W-295,H-38,279,27,'#fff8ef');ctx.globalAlpha=1;
 ctx.strokeStyle='#e8abc5';ctx.lineWidth=2;ctx.strokeRect(W-295.5,H-38.5,279,27);
 text('左右游动  ·  ✦ 上浮  ·  跟随泡泡',W-155,H-20,'#526985',11,'center');ctx.restore();
}

 if(!FINAL_HOME_RIDDLE.trim()){
  menu('🏡 最后的家中线索 · 尚未揭晓','三块藏宝图已经拼好了！<br><br>🦁「礼物就在家里，不过最后的藏匿地点，要等我准备好才告诉你哦。」<br><br><small>这张线索卡还未配置具体位置；不会让你在不知道位置的情况下误点“已找到”。</small>',[['💌 收好藏宝图',()=>showTreasureMap(back)],['返回',back||home]]);return;
 }
 menu('🎁 一周年惊喜 · 三重寻宝线索','<div style="padding:14px;border:2px dashed #d6a7b5;border-radius:12px;background:#fff9e8"><strong>'+FINAL_HOME_RIDDLE+'</strong></div>',[['🎁 我真的找到啦！',()=>menu('💕 我们的故事未完待续','Happy 1st Anniversary ♡<br>2025.11.13 — 2026.11.13<br><br>我们的第一年，留下了好多美好的回忆。<br><br>谢谢你陪我走过这一年的春夏秋冬。<br><br>未来还有好多好多故事，想和你一起慢慢写下去。<br><br>—— 永远和你一起的啾啾 🦁',[['返回首页',home]])],['返回藏宝图',()=>showTreasureMap(back)]]);
}
function showTreasureMap(back){
 if(!data.dive.finished){menu('🗺️ 还没拼好','还需要收集三块海底藏宝图碎片。',[['继续寻宝',startDive],['返回',back||home]]);return}
 menu('🗺️ 我们的藏宝图 · 3/3','<div style="background:#fff9e8;border:3px dashed #d5aa82;border-radius:14px;padding:13px;color:#8b6474;line-height:1.8">🐚 珊瑚浅海　→　🫧 泡泡升流峡谷　→　🚢 月光沉船<br>✨ 三块碎片已经拼成完整的藏宝图！<hr style="border:0;border-top:1px solid #e8c8ac"><strong>'+HOME_CLUE+'</strong></div><small>地图指向现实中的三份小惊喜，打开寻宝线索卡继续寻找。</small>',[['🎁 查看三重寻宝线索',()=>showFinalHomeClue(back)],['继续潜水',diveBack],['🏠 返回首页',home]]);
}

// ================= Gate (welcome + anniversary date) =================
function parseDate(v){const d=(v||'').replace(/[^0-9]/g,'');if(d.length===4)return d==='0718';if(d.length===8)return d.slice(4)==='0718';return false}
let wrong=0;
function showGate(step){mode='gate';showUI(false);$('#shade').classList.add('hide');$('#gate').classList.remove('hide');$('#gate-welcome').classList.toggle('hide',step!=='welcome');$('#gate-date').classList.toggle('hide',step!=='date');if(step==='date'){$('#gate-msg').textContent='';setTimeout(()=>{try{$('#gate-input').focus()}catch(e){}},50)}}
function passGate(){try{localStorage.setItem(GATE,'1')}catch(e){}$('#gate-input').blur();$('#gate').classList.add('hide');mode='menu';home()}
$('#gate-enter').addEventListener('click',()=>gateOk()?passGate():showGate('date'));
$('#gate-date').addEventListener('submit',e=>{e.preventDefault();const v=$('#gate-input').value;
 if(parseDate(v)){$('#gate-msg').textContent='答对啦 ♡';setTimeout(passGate,350)}
 else{wrong++;$('#gate-msg').textContent=wrong>=3?'提示：是 7 月的某一天，输入 4 位数字，比如 0101':'再想想～是我们开始熟悉的那天哦';const c=$('#gate-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}});
$('#gate-input').addEventListener('input',e=>{const t=e.target;t.value=t.value.replace(/[^0-9]/g,'').slice(0,8)});

// ================= Input =================
['left','right','jump'].forEach(key=>{let el=$('#'+key);function down(e){e.preventDefault();if(mode!=='play'&&mode!=='dive'&&!(mode==='scene'&&scene&&scene.type==='snow'&&key==='jump'))return;try{el.setPointerCapture(e.pointerId)}catch(_){}held[key]=true;el.classList.add('pressed');if(key==='jump')jumpQueue=true}function up(e){e.preventDefault();held[key]=false;el.classList.remove('pressed')}el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)});
// Pause / interact react on touch-down so they work even while another finger holds a direction key
$('#pause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(mode==='dive')pauseDive();else pause()});
$('#interact').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();interact()});
window.addEventListener('keydown',e=>{if(mode==='gate')return;if(['ArrowLeft','ArrowRight','Space','ArrowUp','Escape','KeyE'].includes(e.code))e.preventDefault();if(e.code==='Escape'){if(mode==='play')pause();else if(mode==='dive')pauseDive();return}if(mode!=='play'&&mode!=='dive'&&!(mode==='scene'&&scene&&scene.type==='snow'))return;if(e.code==='KeyE'){interact();return}if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if((e.code==='Space'||e.code==='ArrowUp')&&!held.jump){held.jump=true;jumpQueue=true}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false;if(e.code==='Space'||e.code==='ArrowUp')held.jump=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='play')pause();else if(mode==='dive')pauseDive()}});
window.addEventListener('blur',()=>{if(mode==='play')pause();else if(mode==='dive')pauseDive()});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,#card'))e.preventDefault()});
document.addEventListener('selectionchange',()=>{if((mode==='play'||mode==='dive')&&window.getSelection)window.getSelection().removeAllRanges()});
// block page scrolling, except inside the text card (long text can scroll)
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#card'))return;if(e.cancelable)e.preventDefault()},{passive:false});
function size(){let vh=window.visualViewport?window.visualViewport.height:window.innerHeight,vw=window.visualViewport?window.visualViewport.width:window.innerWidth;vh=Math.max(200,vh);vw=Math.max(300,vw);document.documentElement.style.setProperty('--available-height',vh+'px');
 W=Math.max(560,Math.min(1000,Math.round(360*vw/vh)));if(canvas.width!==W){canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false}if(L)cam=Math.max(0,Math.min(L.end-W,cam))}
window.addEventListener('resize',size);window.addEventListener('orientationchange',()=>setTimeout(size,300));if(window.visualViewport)window.visualViewport.addEventListener('resize',size);
load();layout(Math.min(2,data.level));respawnAt(L.cps[data.cpLevel===level?Math.min(L.cps.length-1,data.cp):0]);size();setTimeout(size,500);
const artReview=new URLSearchParams(location.search);if(artReview.get('artreview')==='1'){const ax=Math.max(45,Math.min(L.end-70,Number(artReview.get('artx'))||45));$('#gate').classList.add('hide');layout(0);respawnAt(ax);mode='play';showUI(artReview.get('clean')!=='1');if(artReview.get('clean')==='1'){$('#hud').classList.add('hide');$('#controls').classList.add('hide');$('#pause').classList.add('hide')}}else showGate('welcome');requestAnimationFrame(loop);

})();
</script></body></html>
